[project]
name = "mcp-o365-user"
version = "0.1.0"
description = "MCP server for the signed-in user's own Office 365 mail/calendar/OneDrive over Microsoft Graph. Delegated (user-scope) via device-code sign-in - can see only that one user's own data, never tenant-wide."
requires-python = ">=3.11"
dependencies = [
    "mcp-ms-core",
    "mcp>=1.2,<2",
]

[tool.uv.sources]
mcp-ms-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
mcp-o365-user = "mcp_o365_user.server:main"
mcp-o365-user-doctor = "mcp_o365_user.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_o365_user"]
