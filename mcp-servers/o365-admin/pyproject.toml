[project]
name = "mcp-o365-admin"
version = "0.1.0"
description = "MCP server for tenant-wide Office 365 administration over Microsoft Graph - SharePoint sites, Teams, licenses, and any user's mailbox. App-only (admin-scope), tenant-wide."
requires-python = ">=3.11"
dependencies = [
    "mcp-ms-core",
    "mcp>=1.2,<2",
]

[tool.uv.sources]
mcp-ms-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
mcp-o365-admin = "mcp_o365_admin.server:main"
mcp-o365-admin-doctor = "mcp_o365_admin.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_o365_admin"]
