[project]
name = "mcp-ms-core"
version = "0.1.0"
description = "Shared Microsoft Graph auth + HTTP client used by every server in mcp-servers/. Not published - internal to this repo."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "msal>=1.28,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ms_core"]
