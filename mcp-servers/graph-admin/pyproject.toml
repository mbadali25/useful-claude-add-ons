[project]
name = "mcp-graph-admin"
version = "0.1.0"
description = "Read-only-by-default MCP server for Entra ID (Azure AD) directory administration over Microsoft Graph - users, groups, app registrations, directory roles, conditional access. App-only (admin-scope), tenant-wide. Fills the gap the official @azure/mcp server leaves, since Entra ID is served by graph.microsoft.com, not the ARM plane @azure/mcp covers."
requires-python = ">=3.11"
dependencies = [
    "mcp-ms-core",
    "mcp>=1.2,<2",
]

[tool.uv.sources]
mcp-ms-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
mcp-graph-admin = "mcp_graph_admin.server:main"
mcp-graph-admin-doctor = "mcp_graph_admin.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_graph_admin"]
