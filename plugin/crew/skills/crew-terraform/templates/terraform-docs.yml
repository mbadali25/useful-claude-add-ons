# Copy to the module root as `.terraform-docs.yml`.
# Docs: https://terraform-docs.io/user-guide/configuration/
#
# Requires terraform-docs >= 0.16.0 — `footer-from` and `.Module` in `content`
# are not available in earlier releases.

formatter: markdown table

header-from: main.tf
footer-from: footer.md

sections:
  show:
    - header
    - requirements
    - inputs
    - providers
    - resources
    - data-sources
    - modules
    - outputs
    - footer

# `content` overrides section ordering. Anything listed in `sections.show` but
# omitted here is NOT rendered. The hand-rolled Resources loop replaces the
# built-in {{ .Resources }} section because it emits file#line positions.
content: |-
  {{ .Header }}

  {{ .Requirements }}

  ## Resources

  Resources and data sources created by this module.
  {{ range .Module.Resources }}
  - {{ .GetMode }}.{{ .Spec }} ({{ .Position.Filename }}#{{ .Position.Line }})
  {{- end }}

  {{ .Providers }}

  {{ .Inputs }}

  {{ .Outputs }}

  {{ .Footer }}

recursive:
  enabled: false
  path: modules

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

git-commit-message: "Updating Terraform README.md"

settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
