# Rendered by /gizmoduck:ci (gizmoduck 0.0.0-golden) - endpoint stage (Nuclei, ZAP baseline, testssl against staging).
# Re-render with gizmoduck_ci.py rather than hand-editing; the prod-refusal
# guard's staging origins are baked in below and re-checked at runtime.
# Actions are pinned by full commit SHA; the trailing comment names the release.
# Tiers: gizmoduck-pr.yml (1, light PR check), gizmoduck-full.yml (2 + weekly
# code sweep + manual), gizmoduck-endpoints.yml (2 after the staging deploy +
# weekly endpoint sweep + manual). Endpoint scans never run on a pull request.
# Branch protection: require the `gate` job of gizmoduck-pr.yml and of
# gizmoduck-full.yml - each always runs and decides from the event, so a
# later skipped run can never stand in for a failed scan. Every non-draft PR
# triggers both; a docs-only PR's tier-1 gate PASSes with "no scannable
# changes" (decided from a merge-base diff, not a path filter), so it is never
# left waiting for a check that cannot report.
# gizmoduck-inventory.yml keeps endpoints-inventory.md current: it commits the
# regenerated file on non-default branches only and verifies it on the default
# branch.

name: gizmoduck staging endpoint scan

on:
  deployment_status:
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to scan (blank = the configured staging URL; the prod-refusal guard still applies)
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: gizmoduck-endpoints-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.event.deployment.ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GIZMODUCK_HOME: /opt/gizmoduck
  GIZMODUCK_OUT: /tmp/gizmoduck-out/endpoints
  GIZMODUCK_TIER: ${{ github.event_name == 'schedule' && 'sweep' || 'full' }}
  GIZMODUCK_BLOCK_AT: ${{ github.event_name == 'schedule' && 'never' || 'high' }}
  GIZMODUCK_AUTHORIZED_BY: "Jane Doe (CISO), ticket SEC-42 - 'quoted' \"too\""
  GIZMODUCK_DEFAULT_BRANCH: "main"
  GIZMODUCK_SOURCE_REPO: "https://github.com/mbadali25/useful-claude-add-ons"
  GIZMODUCK_REF: "0123456789abcdef0123456789abcdef01234567"
  GIZMODUCK_STAGING_URLS: "https://staging.example.com"
  GIZMODUCK_ENABLE: "nikto,nmap"
  GIZMODUCK_NUCLEI_TEMPLATES: /tmp/gizmoduck-cache/nuclei-templates

jobs:
  trust:
    name: gizmoduck deployment trust check (no secrets)
    if: github.event_name == 'deployment_status'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check out every branch (history only; nothing is run from it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "main"
      - name: Is the deployed SHA on a trusted branch of this repository?
        id: check
        env:
          GIZMODUCK_STAGING_ENVIRONMENT: "staging"
          DEPLOY_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOY_REF: ${{ github.event.deployment.ref }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          neutral() {
            echo "gizmoduck: $1 - not a trusted deployment; the endpoint scan is skipped (neutral) and no secret is used"
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$DEPLOY_ENVIRONMENT" != "$GIZMODUCK_STAGING_ENVIRONMENT" ]; then
            neutral "environment '$DEPLOY_ENVIRONMENT' is not the configured staging environment"
          fi
          branch="${DEPLOY_REF#refs/heads/}"
          case "$branch" in
            "$GIZMODUCK_DEFAULT_BRANCH"|release/*) ;;
            *) neutral "ref '$DEPLOY_REF' is not a trusted branch" ;;
          esac
          if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            neutral "deployment SHA '$DEPLOY_SHA' is not a full commit SHA"
          fi
          # The ref is a name the deployer chose; the SHA is what was deployed. Trust it
          # only when it is reachable from that trusted branch's head in THIS repository.
          if ! git rev-parse -q --verify "refs/remotes/origin/$branch^{commit}" >/dev/null; then
            neutral "branch '$branch' does not exist in this repository"
          fi
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" "refs/remotes/origin/$branch" 2>/dev/null; then
            neutral "deployed SHA $DEPLOY_SHA is not reachable from origin/$branch"
          fi
          echo "gizmoduck: deployed SHA $DEPLOY_SHA is on origin/$branch - trusted"
          echo "trusted=true" >> "$GITHUB_OUTPUT"

  scan:
    name: gizmoduck staging endpoint scan (runner image)
    needs: [trust]
    if: vars.GIZMODUCK_RUNNER != 'bootstrap' && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging' && (github.event.deployment.ref == 'main' || github.event.deployment.ref == 'refs/heads/main' || startsWith(github.event.deployment.ref, 'release/') || startsWith(github.event.deployment.ref, 'refs/heads/release/')) && needs.trust.outputs.trusted == 'true') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.event != 'pull_request_target' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'refs/heads/main' || startsWith(github.event.workflow_run.head_branch, 'release/') || startsWith(github.event.workflow_run.head_branch, 'refs/heads/release/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: "ghcr.io/example/gizmoduck-ci:0.0.0-golden"
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure the gizmoduck toolchain
        run: |
          GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
          if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
            echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
          else
            echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
            if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
            $SUDO apt-get update -y
            $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
            src="$(mktemp -d)"
            git -C "$src" init -q
            git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
            git -C "$src" checkout -q FETCH_HEAD
            $SUDO rm -rf "$GIZMODUCK_HOME"
            $SUDO cp -r "$src/plugin/gizmoduck" "$GIZMODUCK_HOME"
            PIP_BREAK_SYSTEM_PACKAGES=1 bash "$GIZMODUCK_HOME/bootstrap.sh"
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
      - name: Cache key (trust level, ISO week)
        id: week
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then trust="pr"; else trust="trusted"; fi
          suffix=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then suffix="-sweep-$GITHUB_RUN_ID"; fi
          { echo "trust=$trust"; echo "key=$(date -u +%G-%V)"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
      - name: Cache the Nuclei templates
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/gizmoduck-cache/nuclei-templates
          key: gizmoduck-nuclei-${{ steps.week.outputs.trust }}-${{ steps.week.outputs.key }}${{ steps.week.outputs.suffix }}
          restore-keys: gizmoduck-nuclei-${{ steps.week.outputs.trust }}-
      - name: Nuclei templates (seeded from the runner; updated by the weekly sweep)
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" prepare-templates --dir "$GIZMODUCK_NUCLEI_TEMPLATES" --tier "$GIZMODUCK_TIER"
      - name: Endpoints (committed list + re-detect; none is UNVERIFIED and fails)
        env:
          GIZMODUCK_ALLOWED_PROD_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_PROD_ORIGINS }}
          GIZMODUCK_ALLOW_PROD_SCAN: ${{ vars.GIZMODUCK_ALLOW_PROD_SCAN }}
          GIZMODUCK_ALLOWED_IP_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_IP_ORIGINS }}
          GIZMODUCK_TARGET_URL: ${{ inputs.url }}
        run: |
          mkdir -p "$GIZMODUCK_OUT"
          python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" endpoints --config "$GITHUB_WORKSPACE/gizmoduck-ci.json" --repo "$GITHUB_WORKSPACE" \
            --out "$GIZMODUCK_OUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Prod-refusal guard (runs before any endpoint scan)
        env:
          GIZMODUCK_ALLOWED_PROD_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_PROD_ORIGINS }}
          GIZMODUCK_ALLOW_PROD_SCAN: ${{ vars.GIZMODUCK_ALLOW_PROD_SCAN }}
          GIZMODUCK_ALLOWED_IP_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_IP_ORIGINS }}
          GIZMODUCK_TARGET_URL: ${{ inputs.url }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" targets --run-endpoints "$GIZMODUCK_OUT/endpoints-run.json" --out "$GIZMODUCK_OUT/targets.json"
      - name: Find the baseline run (default branch, trusted runs only)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gh-previous-run --workflow gizmoduck-endpoints.yml --trusted "$GIZMODUCK_DEFAULT_BRANCH" --artifact gizmoduck-endpoints >> "$GITHUB_OUTPUT"
      - name: Download the baseline
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gizmoduck-endpoints
          path: /tmp/gizmoduck-baseline/endpoints
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev.outputs.run_id }}
      - name: Scan staging (Nuclei, ZAP baseline, testssl, nikto, nmap)
        id: scan
        env:
          GIZMODUCK_ALLOWED_PROD_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_PROD_ORIGINS }}
          GIZMODUCK_ALLOW_PROD_SCAN: ${{ vars.GIZMODUCK_ALLOW_PROD_SCAN }}
          GIZMODUCK_ALLOWED_IP_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_IP_ORIGINS }}
          GIZMODUCK_TARGET_URL: ${{ inputs.url }}
          GIZMODUCK_AUTH_HEADER_VALUE: ${{ secrets.GIZMODUCK_AUTH_HEADER_VALUE }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" endpoint-stage --targets "$GIZMODUCK_OUT/targets.json" --out "$GIZMODUCK_OUT"
      - name: Reports (JSONL, Markdown, HTML, PDF) and diff
        if: always() && steps.scan.outcome == 'success'
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" publish --out "$GIZMODUCK_OUT" --baseline /tmp/gizmoduck-baseline/endpoints/findings.jsonl --title 'gizmoduck staging endpoint scan'
      - name: Gate (blocks at $GIZMODUCK_BLOCK_AT)
        id: gate
        if: always() && steps.scan.outcome == 'success'
        env:
          GIZMODUCK_ALLOW_NO_BASELINE: ${{ vars.GIZMODUCK_ALLOW_NO_BASELINE }}
          GIZMODUCK_ALLOW_INCOMPLETE: ${{ vars.GIZMODUCK_ALLOW_INCOMPLETE }}
          GIZMODUCK_TRUST_ASSIGNED_SEVERITY: ${{ vars.GIZMODUCK_TRUST_ASSIGNED_SEVERITY }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gate --baseline /tmp/gizmoduck-baseline/endpoints/findings.jsonl --current "$GIZMODUCK_OUT/findings.jsonl" --manifest "$GIZMODUCK_OUT/run-manifest.json" --block-at "$GIZMODUCK_BLOCK_AT" --json-out "$GIZMODUCK_OUT/gate.json" --new-out "$GIZMODUCK_OUT/new-blocking.jsonl" --summary "$GITHUB_STEP_SUMMARY"
      - name: security-scan-report.md (counts per module and endpoint; UNVERIFIED where nothing scanned)
        if: always()
        run: |
          mkdir -p "$GIZMODUCK_OUT"
          python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" scan-report --repo "$GITHUB_WORKSPACE" --out "$GIZMODUCK_OUT" --commit "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" --tier "$GIZMODUCK_TIER" --baseline /tmp/gizmoduck-baseline/endpoints/findings.jsonl \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gizmoduck-endpoints
          path: /tmp/gizmoduck-out/endpoints
          retention-days: 90
          if-no-files-found: warn
      - name: ServiceDesk Plus tickets for new Critical/High (opt-in)
        if: always() && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure') && github.event_name != 'pull_request' && vars.GIZMODUCK_SDP_TICKETS == 'true'
        env:
          GIZMODUCK_SDP_TICKETS: ${{ vars.GIZMODUCK_SDP_TICKETS }}
          SDP_BASE_URL: ${{ secrets.SDP_BASE_URL }}
          SDP_API_KEY: ${{ secrets.SDP_API_KEY }}
          SDP_AUTH_HEADER: ${{ vars.SDP_AUTH_HEADER }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" tickets "$GIZMODUCK_OUT/new-blocking.jsonl" --out "$GIZMODUCK_OUT/tickets.json" --yes

  scan-bootstrap:
    name: gizmoduck staging endpoint scan (inline bootstrap fallback)
    needs: [trust]
    if: vars.GIZMODUCK_RUNNER == 'bootstrap' && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging' && (github.event.deployment.ref == 'main' || github.event.deployment.ref == 'refs/heads/main' || startsWith(github.event.deployment.ref, 'release/') || startsWith(github.event.deployment.ref, 'refs/heads/release/')) && needs.trust.outputs.trusted == 'true') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.event != 'pull_request_target' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'refs/heads/main' || startsWith(github.event.workflow_run.head_branch, 'release/') || startsWith(github.event.workflow_run.head_branch, 'refs/heads/release/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure the gizmoduck toolchain
        run: |
          GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
          if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
            echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
          else
            echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
            if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
            $SUDO apt-get update -y
            $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
            src="$(mktemp -d)"
            git -C "$src" init -q
            git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
            git -C "$src" checkout -q FETCH_HEAD
            $SUDO rm -rf "$GIZMODUCK_HOME"
            $SUDO cp -r "$src/plugin/gizmoduck" "$GIZMODUCK_HOME"
            PIP_BREAK_SYSTEM_PACKAGES=1 bash "$GIZMODUCK_HOME/bootstrap.sh"
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
      - name: Cache key (trust level, ISO week)
        id: week
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then trust="pr"; else trust="trusted"; fi
          suffix=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then suffix="-sweep-$GITHUB_RUN_ID"; fi
          { echo "trust=$trust"; echo "key=$(date -u +%G-%V)"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
      - name: Cache the Nuclei templates
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/gizmoduck-cache/nuclei-templates
          key: gizmoduck-nuclei-${{ steps.week.outputs.trust }}-${{ steps.week.outputs.key }}${{ steps.week.outputs.suffix }}
          restore-keys: gizmoduck-nuclei-${{ steps.week.outputs.trust }}-
      - name: Nuclei templates (seeded from the runner; updated by the weekly sweep)
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" prepare-templates --dir "$GIZMODUCK_NUCLEI_TEMPLATES" --tier "$GIZMODUCK_TIER"
      - name: Endpoints (committed list + re-detect; none is UNVERIFIED and fails)
        env:
          GIZMODUCK_ALLOWED_PROD_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_PROD_ORIGINS }}
          GIZMODUCK_ALLOW_PROD_SCAN: ${{ vars.GIZMODUCK_ALLOW_PROD_SCAN }}
          GIZMODUCK_ALLOWED_IP_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_IP_ORIGINS }}
          GIZMODUCK_TARGET_URL: ${{ inputs.url }}
        run: |
          mkdir -p "$GIZMODUCK_OUT"
          python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" endpoints --config "$GITHUB_WORKSPACE/gizmoduck-ci.json" --repo "$GITHUB_WORKSPACE" \
            --out "$GIZMODUCK_OUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Prod-refusal guard (runs before any endpoint scan)
        env:
          GIZMODUCK_ALLOWED_PROD_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_PROD_ORIGINS }}
          GIZMODUCK_ALLOW_PROD_SCAN: ${{ vars.GIZMODUCK_ALLOW_PROD_SCAN }}
          GIZMODUCK_ALLOWED_IP_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_IP_ORIGINS }}
          GIZMODUCK_TARGET_URL: ${{ inputs.url }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" targets --run-endpoints "$GIZMODUCK_OUT/endpoints-run.json" --out "$GIZMODUCK_OUT/targets.json"
      - name: Find the baseline run (default branch, trusted runs only)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gh-previous-run --workflow gizmoduck-endpoints.yml --trusted "$GIZMODUCK_DEFAULT_BRANCH" --artifact gizmoduck-endpoints >> "$GITHUB_OUTPUT"
      - name: Download the baseline
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gizmoduck-endpoints
          path: /tmp/gizmoduck-baseline/endpoints
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev.outputs.run_id }}
      - name: Scan staging (Nuclei, ZAP baseline, testssl, nikto, nmap)
        id: scan
        env:
          GIZMODUCK_ALLOWED_PROD_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_PROD_ORIGINS }}
          GIZMODUCK_ALLOW_PROD_SCAN: ${{ vars.GIZMODUCK_ALLOW_PROD_SCAN }}
          GIZMODUCK_ALLOWED_IP_ORIGINS: ${{ vars.GIZMODUCK_ALLOWED_IP_ORIGINS }}
          GIZMODUCK_TARGET_URL: ${{ inputs.url }}
          GIZMODUCK_AUTH_HEADER_VALUE: ${{ secrets.GIZMODUCK_AUTH_HEADER_VALUE }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" endpoint-stage --targets "$GIZMODUCK_OUT/targets.json" --out "$GIZMODUCK_OUT"
      - name: Reports (JSONL, Markdown, HTML, PDF) and diff
        if: always() && steps.scan.outcome == 'success'
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" publish --out "$GIZMODUCK_OUT" --baseline /tmp/gizmoduck-baseline/endpoints/findings.jsonl --title 'gizmoduck staging endpoint scan'
      - name: Gate (blocks at $GIZMODUCK_BLOCK_AT)
        id: gate
        if: always() && steps.scan.outcome == 'success'
        env:
          GIZMODUCK_ALLOW_NO_BASELINE: ${{ vars.GIZMODUCK_ALLOW_NO_BASELINE }}
          GIZMODUCK_ALLOW_INCOMPLETE: ${{ vars.GIZMODUCK_ALLOW_INCOMPLETE }}
          GIZMODUCK_TRUST_ASSIGNED_SEVERITY: ${{ vars.GIZMODUCK_TRUST_ASSIGNED_SEVERITY }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gate --baseline /tmp/gizmoduck-baseline/endpoints/findings.jsonl --current "$GIZMODUCK_OUT/findings.jsonl" --manifest "$GIZMODUCK_OUT/run-manifest.json" --block-at "$GIZMODUCK_BLOCK_AT" --json-out "$GIZMODUCK_OUT/gate.json" --new-out "$GIZMODUCK_OUT/new-blocking.jsonl" --summary "$GITHUB_STEP_SUMMARY"
      - name: security-scan-report.md (counts per module and endpoint; UNVERIFIED where nothing scanned)
        if: always()
        run: |
          mkdir -p "$GIZMODUCK_OUT"
          python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" scan-report --repo "$GITHUB_WORKSPACE" --out "$GIZMODUCK_OUT" --commit "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" --tier "$GIZMODUCK_TIER" --baseline /tmp/gizmoduck-baseline/endpoints/findings.jsonl \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gizmoduck-endpoints
          path: /tmp/gizmoduck-out/endpoints
          retention-days: 90
          if-no-files-found: warn
      - name: ServiceDesk Plus tickets for new Critical/High (opt-in)
        if: always() && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure') && github.event_name != 'pull_request' && vars.GIZMODUCK_SDP_TICKETS == 'true'
        env:
          GIZMODUCK_SDP_TICKETS: ${{ vars.GIZMODUCK_SDP_TICKETS }}
          SDP_BASE_URL: ${{ secrets.SDP_BASE_URL }}
          SDP_API_KEY: ${{ secrets.SDP_API_KEY }}
          SDP_AUTH_HEADER: ${{ vars.SDP_AUTH_HEADER }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" tickets "$GIZMODUCK_OUT/new-blocking.jsonl" --out "$GIZMODUCK_OUT/tickets.json" --yes

  publish-report:
    name: gizmoduck security-scan-report.md (commit on the branch; never the default branch)
    needs: [scan, scan-bootstrap]
    if: always() && (needs.scan.result == 'success' || needs.scan.result == 'failure' || needs.scan-bootstrap.result == 'success' || needs.scan-bootstrap.result == 'failure') && github.event_name != 'schedule' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref_type == 'branch') && (github.event.workflow_run.head_branch || github.event.deployment.ref || github.ref_name) != 'main' && (github.event.workflow_run.head_branch || github.event.deployment.ref || github.ref_name) != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GIZMODUCK_DEFAULT_BRANCH: "main"
      GIZMODUCK_PUBLISH_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.deployment.ref || github.ref_name }}
      GIZMODUCK_PUBLISH_FILES: security-scan-report.md
      GIZMODUCK_PUBLISH_WHAT: security-scan-report.md
    steps:
      - name: Check out the branch the scan ran for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_branch || github.event.deployment.ref || github.ref_name }}
      - name: Download the scan results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gizmoduck-endpoints
          path: /tmp/gizmoduck-report
      - name: Commit security-scan-report.md ([skip ci]; branch only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/gizmoduck-report/security-scan-report.md ]; then
            echo "gizmoduck: the scan left no security-scan-report.md - nothing to commit (see the run artifacts)"
            exit 0
          fi
          cp /tmp/gizmoduck-report/security-scan-report.md security-scan-report.md
          GIZMODUCK_GIT_AUTH="http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIZMODUCK_GIT_AUTH
          branch="${GIZMODUCK_PUBLISH_BRANCH#refs/heads/}"
          if [ -z "$branch" ] || [ "$branch" = "$GIZMODUCK_DEFAULT_BRANCH" ]; then
            echo "gizmoduck: '${branch:-<no branch>}' is the default branch (or unknown) - verify-only there;" "$GIZMODUCK_PUBLISH_WHAT is not committed"
          else
            # shellcheck disable=SC2086
            git add -- $GIZMODUCK_PUBLISH_FILES
            if git diff --cached --quiet; then
              echo "gizmoduck: $GIZMODUCK_PUBLISH_WHAT unchanged on $branch - nothing to commit"
            elif [ "${GIZMODUCK_PUBLISH_ALLOW_REPEAT:-}" != "true" ] && git log -1 --format=%B | grep -qF '[gizmoduck-self-commit]'; then
              echo "gizmoduck: HEAD is already a gizmoduck self-commit and $GIZMODUCK_PUBLISH_WHAT still differs -"
              echo "refusing to commit again (loop guard). Regenerate it locally and commit the result."
              exit 1
            else
              git -c user.name=gizmoduck-ci -c user.email=gizmoduck-ci@noreply.invalid commit -q       -m "gizmoduck: regenerate $GIZMODUCK_PUBLISH_WHAT [skip ci] [gizmoduck-self-commit]"
              if [ -n "${GIZMODUCK_GIT_AUTH:-}" ]; then
                push_ok() { git -c "$GIZMODUCK_GIT_AUTH" push -q origin "HEAD:refs/heads/$branch"; }
              else
                push_ok() { git push -q origin "HEAD:refs/heads/$branch"; }
              fi
              if push_ok; then
                echo "gizmoduck: $GIZMODUCK_PUBLISH_WHAT committed on $branch"
              else
                echo "gizmoduck: could not push the $GIZMODUCK_PUBLISH_WHAT commit to $branch (did the branch move?)."
                echo "  The run for the newer commit regenerates it; or regenerate locally and commit it."
                exit 1
              fi
            fi
          fi
