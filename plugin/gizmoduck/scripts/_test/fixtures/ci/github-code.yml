# Rendered by /gizmoduck:ci (gizmoduck 0.0.0-golden) - code stage (Semgrep, Trivy fs, Checkov, Dependency-Check).
# Re-render with gizmoduck_ci.py rather than hand-editing; the prod-refusal
# guard's staging origins are baked in below and re-checked at runtime.
# Actions are pinned by full commit SHA; the trailing comment names the release.

name: gizmoduck code scan

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gizmoduck-code-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GIZMODUCK_HOME: /opt/gizmoduck
  GIZMODUCK_OUT: /tmp/gizmoduck-out/code
  GIZMODUCK_AUTHORIZED_BY: "Jane Doe (CISO), ticket SEC-42 - 'quoted' \"too\""
  GIZMODUCK_DEFAULT_BRANCH: "main"
  GIZMODUCK_SOURCE_REPO: "https://github.com/mbadali25/useful-claude-add-ons"
  GIZMODUCK_REF: "0123456789abcdef0123456789abcdef01234567"
  GIZMODUCK_STAGING_URLS: "https://staging.example.com"
  GIZMODUCK_ENABLE: "nikto,nmap"

jobs:
  scan:
    name: gizmoduck code scan (runner image)
    if: vars.GIZMODUCK_RUNNER != 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/example/gizmoduck-ci:0.0.0-golden
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure the gizmoduck toolchain
        run: |
          GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
          if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
            echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
          else
            echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
            if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
            $SUDO apt-get update -y
            $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
            src="$(mktemp -d)"
            git -C "$src" init -q
            git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
            git -C "$src" checkout -q FETCH_HEAD
            $SUDO rm -rf "$GIZMODUCK_HOME"
            $SUDO cp -r "$src/plugin/gizmoduck" "$GIZMODUCK_HOME"
            PIP_BREAK_SYSTEM_PACKAGES=1 bash "$GIZMODUCK_HOME/bootstrap.sh"
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
      - name: Find the baseline run
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gh-previous-run --workflow gizmoduck-code.yml --branch "$GIZMODUCK_DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Download the baseline
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gizmoduck-code
          path: /tmp/gizmoduck-baseline/code
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev.outputs.run_id }}
      - name: Scan (Semgrep, Trivy fs, Checkov, Dependency-Check)
        id: scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" code-stage --path "$GITHUB_WORKSPACE" --out "$GIZMODUCK_OUT"
      - name: SARIF
        id: sarif
        if: always() && steps.scan.outcome == 'success'
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" sarif "$GIZMODUCK_OUT/findings.jsonl" --out "$GIZMODUCK_OUT/gizmoduck.sarif" --srcroot "$GITHUB_WORKSPACE"
      - name: Upload SARIF to code scanning
        if: always() && steps.sarif.outcome == 'success'
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: /tmp/gizmoduck-out/code/gizmoduck.sarif
          category: gizmoduck-code
      - name: Reports (JSONL, Markdown, HTML, PDF) and diff
        if: always() && steps.scan.outcome == 'success'
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" publish --out "$GIZMODUCK_OUT" --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --title 'gizmoduck code scan'
      - name: Fail on new Critical/High
        id: gate
        if: always() && steps.scan.outcome == 'success'
        env:
          GIZMODUCK_ALLOW_NO_BASELINE: ${{ vars.GIZMODUCK_ALLOW_NO_BASELINE }}
          GIZMODUCK_ALLOW_INCOMPLETE: ${{ vars.GIZMODUCK_ALLOW_INCOMPLETE }}
          GIZMODUCK_TRUST_ASSIGNED_SEVERITY: ${{ vars.GIZMODUCK_TRUST_ASSIGNED_SEVERITY }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gate --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --current "$GIZMODUCK_OUT/findings.jsonl" --manifest "$GIZMODUCK_OUT/run-manifest.json" --json-out "$GIZMODUCK_OUT/gate.json" --new-out "$GIZMODUCK_OUT/new-blocking.jsonl" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gizmoduck-code
          path: /tmp/gizmoduck-out/code
          retention-days: 90
          if-no-files-found: warn
      - name: ServiceDesk Plus tickets for new Critical/High (opt-in)
        if: always() && steps.gate.outcome == 'failure' && github.event_name != 'pull_request' && vars.GIZMODUCK_SDP_TICKETS == 'true'
        env:
          GIZMODUCK_SDP_TICKETS: ${{ vars.GIZMODUCK_SDP_TICKETS }}
          SDP_BASE_URL: ${{ secrets.SDP_BASE_URL }}
          SDP_API_KEY: ${{ secrets.SDP_API_KEY }}
          SDP_AUTH_HEADER: ${{ vars.SDP_AUTH_HEADER }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" tickets "$GIZMODUCK_OUT/new-blocking.jsonl" --out "$GIZMODUCK_OUT/tickets.json" --yes

  scan-bootstrap:
    name: gizmoduck code scan (inline bootstrap fallback)
    if: vars.GIZMODUCK_RUNNER == 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure the gizmoduck toolchain
        run: |
          GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
          if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
            echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
          else
            echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
            if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
            $SUDO apt-get update -y
            $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
            src="$(mktemp -d)"
            git -C "$src" init -q
            git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
            git -C "$src" checkout -q FETCH_HEAD
            $SUDO rm -rf "$GIZMODUCK_HOME"
            $SUDO cp -r "$src/plugin/gizmoduck" "$GIZMODUCK_HOME"
            PIP_BREAK_SYSTEM_PACKAGES=1 bash "$GIZMODUCK_HOME/bootstrap.sh"
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
      - name: Find the baseline run
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gh-previous-run --workflow gizmoduck-code.yml --branch "$GIZMODUCK_DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Download the baseline
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gizmoduck-code
          path: /tmp/gizmoduck-baseline/code
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev.outputs.run_id }}
      - name: Scan (Semgrep, Trivy fs, Checkov, Dependency-Check)
        id: scan
        env:
