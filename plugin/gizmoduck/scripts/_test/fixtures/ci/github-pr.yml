# Rendered by /gizmoduck:ci (gizmoduck 0.0.0-golden) - tier 1, light PR check (blocks on a new Critical only).
# Re-render with gizmoduck_ci.py rather than hand-editing; the prod-refusal
# guard's staging origins are baked in below and re-checked at runtime.
# Actions are pinned by full commit SHA; the trailing comment names the release.
# Tiers: gizmoduck-pr.yml (1, light PR check), gizmoduck-full.yml (2 + weekly
# code sweep + manual), gizmoduck-endpoints.yml (2 after the staging deploy +
# weekly endpoint sweep + manual). Endpoint scans never run on a pull request.
# Branch protection: require the `gate` job of gizmoduck-pr.yml and of
# gizmoduck-full.yml - each always runs and decides from the event, so a
# later skipped run can never stand in for a failed scan. (A docs-only PR
# does not trigger gizmoduck-pr.yml at all, so its gate reports nothing.)

name: gizmoduck PR check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.gif"

permissions: {}

concurrency:
  group: gizmoduck-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GIZMODUCK_HOME: /opt/gizmoduck
  GIZMODUCK_OUT: /tmp/gizmoduck-out/code
  GIZMODUCK_TIER: light
  GIZMODUCK_BLOCK_AT: critical
  GIZMODUCK_AUTHORIZED_BY: "Jane Doe (CISO), ticket SEC-42 - 'quoted' \"too\""
  GIZMODUCK_DEFAULT_BRANCH: "main"
  GIZMODUCK_SOURCE_REPO: "https://github.com/mbadali25/useful-claude-add-ons"
  GIZMODUCK_REF: "0123456789abcdef0123456789abcdef01234567"
  GIZMODUCK_STAGING_URLS: "https://staging.example.com"
  GIZMODUCK_ENABLE: "nikto,nmap"
  TRIVY_CACHE_DIR: /tmp/gizmoduck-cache/trivy

jobs:
  scan:
    name: gizmoduck PR check (runner image)
    if: vars.GIZMODUCK_RUNNER != 'bootstrap' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && !(github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'security-scan'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: "ghcr.io/example/gizmoduck-ci:0.0.0-golden"
    permissions:
      contents: read
      actions: read
    outputs:
      sarif: ${{ steps.sarif.outcome == 'success' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure the gizmoduck toolchain
        run: |
          GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
          if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
            echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
          else
            echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
            if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
            $SUDO apt-get update -y
            $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
            src="$(mktemp -d)"
            git -C "$src" init -q
            git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
            git -C "$src" checkout -q FETCH_HEAD
            $SUDO rm -rf "$GIZMODUCK_HOME"
            $SUDO cp -r "$src/plugin/gizmoduck" "$GIZMODUCK_HOME"
            PIP_BREAK_SYSTEM_PACKAGES=1 bash "$GIZMODUCK_HOME/bootstrap.sh"
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
      - name: Cache key (trust level, ISO week)
        id: week
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then trust="pr"; else trust="trusted"; fi
          suffix=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then suffix="-sweep-$GITHUB_RUN_ID"; fi
          { echo "trust=$trust"; echo "key=$(date -u +%G-%V)"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
      - name: Cache the Trivy vulnerability DB
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/gizmoduck-cache/trivy
          key: gizmoduck-trivy-${{ steps.week.outputs.trust }}-${{ steps.week.outputs.key }}${{ steps.week.outputs.suffix }}
          restore-keys: gizmoduck-trivy-${{ steps.week.outputs.trust }}-
      - name: Find the baseline run (default branch, trusted runs only)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gh-previous-run --workflow gizmoduck-full.yml --trusted "$GIZMODUCK_DEFAULT_BRANCH" --artifact gizmoduck-code >> "$GITHUB_OUTPUT"
      - name: Download the baseline
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gizmoduck-code
          path: /tmp/gizmoduck-baseline/code
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev.outputs.run_id }}
      - name: Scan (Semgrep diff-aware, Trivy if a manifest changed, Checkov if *.tf changed, gitleaks)
        id: scan
        env:
          GIZMODUCK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" code-stage --tier light --base-ref "$GIZMODUCK_BASE_SHA" \
            --path "$GITHUB_WORKSPACE" --out "$GIZMODUCK_OUT"
      - name: SARIF (uploaded by the sarif job)
        id: sarif
        if: always() && steps.scan.outcome == 'success'
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" sarif "$GIZMODUCK_OUT/findings.jsonl" --out "$GIZMODUCK_OUT/gizmoduck.sarif" --srcroot "$GITHUB_WORKSPACE"
      - name: Reports (JSONL, Markdown, HTML, PDF) and diff
        if: always() && steps.scan.outcome == 'success'
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" publish --out "$GIZMODUCK_OUT" --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --title 'gizmoduck PR check'
      - name: Gate (blocks at $GIZMODUCK_BLOCK_AT)
        id: gate
        if: always() && steps.scan.outcome == 'success'
        env:
          GIZMODUCK_ALLOW_NO_BASELINE: ${{ vars.GIZMODUCK_ALLOW_NO_BASELINE }}
          GIZMODUCK_ALLOW_INCOMPLETE: ${{ vars.GIZMODUCK_ALLOW_INCOMPLETE }}
          GIZMODUCK_TRUST_ASSIGNED_SEVERITY: ${{ vars.GIZMODUCK_TRUST_ASSIGNED_SEVERITY }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gate --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --current "$GIZMODUCK_OUT/findings.jsonl" --manifest "$GIZMODUCK_OUT/run-manifest.json" --block-at "$GIZMODUCK_BLOCK_AT" --json-out "$GIZMODUCK_OUT/gate.json" --new-out "$GIZMODUCK_OUT/new-blocking.jsonl" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gizmoduck-code
          path: /tmp/gizmoduck-out/code
          retention-days: 90
          if-no-files-found: warn

  scan-bootstrap:
    name: gizmoduck PR check (inline bootstrap fallback)
    if: vars.GIZMODUCK_RUNNER == 'bootstrap' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && !(github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'security-scan'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    outputs:
      sarif: ${{ steps.sarif.outcome == 'success' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure the gizmoduck toolchain
        run: |
          GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
          if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
            echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
          else
            echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
            if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
            $SUDO apt-get update -y
            $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
            src="$(mktemp -d)"
            git -C "$src" init -q
            git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
            git -C "$src" checkout -q FETCH_HEAD
            $SUDO rm -rf "$GIZMODUCK_HOME"
            $SUDO cp -r "$src/plugin/gizmoduck" "$GIZMODUCK_HOME"
            PIP_BREAK_SYSTEM_PACKAGES=1 bash "$GIZMODUCK_HOME/bootstrap.sh"
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
      - name: Cache key (trust level, ISO week)
        id: week
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then trust="pr"; else trust="trusted"; fi
          suffix=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then suffix="-sweep-$GITHUB_RUN_ID"; fi
          { echo "trust=$trust"; echo "key=$(date -u +%G-%V)"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
      - name: Cache the Trivy vulnerability DB
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/gizmoduck-cache/trivy
          key: gizmoduck-trivy-${{ steps.week.outputs.trust }}-${{ steps.week.outputs.key }}${{ steps.week.outputs.suffix }}
          restore-keys: gizmoduck-trivy-${{ steps.week.outputs.trust }}-
      - name: Find the baseline run (default branch, trusted runs only)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gh-previous-run --workflow gizmoduck-full.yml --trusted "$GIZMODUCK_DEFAULT_BRANCH" --artifact gizmoduck-code >> "$GITHUB_OUTPUT"
      - name: Download the baseline
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gizmoduck-code
          path: /tmp/gizmoduck-baseline/code
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev.outputs.run_id }}
      - name: Scan (Semgrep diff-aware, Trivy if a manifest changed, Checkov if *.tf changed, gitleaks)
        id: scan
        env:
          GIZMODUCK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" code-stage --tier light --base-ref "$GIZMODUCK_BASE_SHA" \
            --path "$GITHUB_WORKSPACE" --out "$GIZMODUCK_OUT"
      - name: SARIF (uploaded by the sarif job)
        id: sarif
        if: always() && steps.scan.outcome == 'success'
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" sarif "$GIZMODUCK_OUT/findings.jsonl" --out "$GIZMODUCK_OUT/gizmoduck.sarif" --srcroot "$GITHUB_WORKSPACE"
      - name: Reports (JSONL, Markdown, HTML, PDF) and diff
        if: always() && steps.scan.outcome == 'success'
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" publish --out "$GIZMODUCK_OUT" --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --title 'gizmoduck PR check'
      - name: Gate (blocks at $GIZMODUCK_BLOCK_AT)
        id: gate
        if: always() && steps.scan.outcome == 'success'
        env:
          GIZMODUCK_ALLOW_NO_BASELINE: ${{ vars.GIZMODUCK_ALLOW_NO_BASELINE }}
          GIZMODUCK_ALLOW_INCOMPLETE: ${{ vars.GIZMODUCK_ALLOW_INCOMPLETE }}
          GIZMODUCK_TRUST_ASSIGNED_SEVERITY: ${{ vars.GIZMODUCK_TRUST_ASSIGNED_SEVERITY }}
        run: python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gate --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --current "$GIZMODUCK_OUT/findings.jsonl" --manifest "$GIZMODUCK_OUT/run-manifest.json" --block-at "$GIZMODUCK_BLOCK_AT" --json-out "$GIZMODUCK_OUT/gate.json" --new-out "$GIZMODUCK_OUT/new-blocking.jsonl" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gizmoduck-code
          path: /tmp/gizmoduck-out/code
          retention-days: 90
          if-no-files-found: warn

  sarif:
    name: gizmoduck PR check (upload SARIF)
    needs: [scan, scan-bootstrap]
    if: always() && (needs.scan.outputs.sarif == 'true' || needs.scan-bootstrap.outputs.sarif == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gizmoduck-code
          path: /tmp/gizmoduck-sarif
      - name: Upload SARIF to code scanning
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: /tmp/gizmoduck-sarif/gizmoduck.sarif
          category: gizmoduck-code

  gate:
    name: gizmoduck PR check gate
    needs: [scan, scan-bootstrap]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      GIZMODUCK_APPLIES: ${{ true && github.event_name == 'pull_request' && github.event.pull_request.draft == false && !(github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'security-scan')) }}
      IMAGE_RESULT: ${{ needs.scan.result }}
      BOOT_RESULT: ${{ needs.scan-bootstrap.result }}
    steps:
      - name: Gate (required check - always runs, decides from the event)
        run: |
          if [ "$GIZMODUCK_APPLIES" != "true" ]; then
            echo "gizmoduck: this event is outside this workflow's tier - nothing to gate (pass)"
            exit 0
          fi
          echo "gizmoduck: scan jobs - runner image: $IMAGE_RESULT, inline bootstrap: $BOOT_RESULT"
          if { [ "$IMAGE_RESULT" = "success" ] && [ "$BOOT_RESULT" = "skipped" ]; } \
             || { [ "$IMAGE_RESULT" = "skipped" ] && [ "$BOOT_RESULT" = "success" ]; }; then
            echo "gizmoduck: gate PASS"
            exit 0
          fi
          echo "gizmoduck: gate FAIL - the scan this event requires did not pass"
          exit 1
