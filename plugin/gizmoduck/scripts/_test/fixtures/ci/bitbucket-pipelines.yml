                 unset GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE ;;
            esac
          - |
            GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
