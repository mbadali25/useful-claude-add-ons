              --branch "${BITBUCKET_BRANCH:-}" --tier "$GIZMODUCK_TIER" \
              --baseline /tmp/gizmoduck-baseline/endpoints/findings.jsonl \
              --run-url "https://bitbucket.org/$BITBUCKET_REPO_FULL_NAME/pipelines/results/$BITBUCKET_BUILD_NUMBER" \
              || echo "gizmoduck: security-scan-report.md could not be written (exit $?)"
            cp "$GIZMODUCK_OUT/security-scan-report.md" "$BITBUCKET_CLONE_DIR/gizmoduck-out/endpoints/" 2>/dev/null || true
            if [ "$GIZMODUCK_TIER" = "sweep" ] && [ "${GIZMODUCK_REPORT_DOWNLOADS:-}" = "true" ] \
            && [ "${BITBUCKET_BRANCH:-}" = "$GIZMODUCK_DEFAULT_BRANCH" ] && [ -n "${GIZMODUCK_BB_TOKEN:-}" ] \
            && [ -f "$GIZMODUCK_OUT/security-scan-report.md" ]; then
              curl -fsS -X POST -H "Authorization: Bearer $GIZMODUCK_BB_TOKEN" \
            -F "files=@$GIZMODUCK_OUT/security-scan-report.md;filename=gizmoduck-security-scan-report.md" \
            "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/downloads" \
            || echo "gizmoduck: uploading security-scan-report.md to Downloads failed - it is still in this run's artifacts"
            fi
        artifacts:
          - gizmoduck-out/**
    - step: &gizmoduck-inventory-branch
        name: "gizmoduck: regenerate endpoints-inventory.md and commit it on this branch"
        max-time: 15
        script:
          - |
            export GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            export GIZMODUCK_DEFAULT_BRANCH=main
            export GIZMODUCK_SOURCE_REPO=https://github.com/mbadali25/useful-claude-add-ons
            export GIZMODUCK_REF=0123456789abcdef0123456789abcdef01234567
            # No secret is used here, and none should be visible (they are deployment variables).
            unset GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE
          - |
            GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            if [ ! -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
              echo "gizmoduck: runner image not in use - fetching the scripts from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF"
              command -v git >/dev/null 2>&1 || { apt-get update -y && apt-get install -y git ca-certificates python3; }
              src="$(mktemp -d)"
              git -C "$src" init -q
              git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
              git -C "$src" checkout -q FETCH_HEAD
              GIZMODUCK_HOME="$src/plugin/gizmoduck"
            fi
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" inventory --repo "$BITBUCKET_CLONE_DIR" --output endpoints-inventory.md
          - |
            export GIZMODUCK_PUBLISH_BRANCH="${BITBUCKET_BRANCH:-}" GIZMODUCK_PUBLISH_FILES=endpoints-inventory.md GIZMODUCK_PUBLISH_WHAT=endpoints-inventory.md
            branch="${GIZMODUCK_PUBLISH_BRANCH#refs/heads/}"
            if [ -z "$branch" ] || [ "$branch" = "$GIZMODUCK_DEFAULT_BRANCH" ]; then
              echo "gizmoduck: '${branch:-<no branch>}' is the default branch (or unknown) - verify-only there;" "$GIZMODUCK_PUBLISH_WHAT is not committed"
            else
              # shellcheck disable=SC2086
              git add -- $GIZMODUCK_PUBLISH_FILES
              if git diff --cached --quiet; then
                echo "gizmoduck: $GIZMODUCK_PUBLISH_WHAT unchanged on $branch - nothing to commit"
              elif git log -1 --format=%B | grep -qF '[gizmoduck-self-commit]'; then
                echo "gizmoduck: HEAD is already a gizmoduck self-commit and $GIZMODUCK_PUBLISH_WHAT still differs -"
                echo "refusing to commit again (loop guard). Regenerate it locally and commit the result."
                exit 1
              else
                git -c user.name=gizmoduck-ci -c user.email=gizmoduck-ci@noreply.invalid commit -q       -m "gizmoduck: regenerate $GIZMODUCK_PUBLISH_WHAT [skip ci] [gizmoduck-self-commit]"
                if [ -n "${GIZMODUCK_GIT_AUTH:-}" ]; then
                  push_ok() { git -c "$GIZMODUCK_GIT_AUTH" push -q origin "HEAD:refs/heads/$branch"; }
                else
                  push_ok() { git push -q origin "HEAD:refs/heads/$branch"; }
                fi
                if push_ok; then
                  echo "gizmoduck: $GIZMODUCK_PUBLISH_WHAT committed on $branch"
                else
                  echo "gizmoduck: could not push the $GIZMODUCK_PUBLISH_WHAT commit to $branch (did the branch move?)."
                  echo "  The run for the newer commit regenerates it; or regenerate locally and commit it."
                  exit 1
                fi
              fi
            fi
    - step: &gizmoduck-inventory-verify
        name: "gizmoduck: endpoints-inventory.md is current (verify-only; never writes)"
        max-time: 15
        script:
          - |
            export GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            export GIZMODUCK_DEFAULT_BRANCH=main
            export GIZMODUCK_SOURCE_REPO=https://github.com/mbadali25/useful-claude-add-ons
            export GIZMODUCK_REF=0123456789abcdef0123456789abcdef01234567
            # No secret is used here, and none should be visible (they are deployment variables).
            unset GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE
          - |
            GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            if [ ! -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
              echo "gizmoduck: runner image not in use - fetching the scripts from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF"
              command -v git >/dev/null 2>&1 || { apt-get update -y && apt-get install -y git ca-certificates python3; }
              src="$(mktemp -d)"
              git -C "$src" init -q
              git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
              git -C "$src" checkout -q FETCH_HEAD
              GIZMODUCK_HOME="$src/plugin/gizmoduck"
            fi
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" check --repo "$BITBUCKET_CLONE_DIR" --output endpoints-inventory.md
    - step: &gizmoduck-publish-report
        name: "gizmoduck: commit security-scan-report.md on this branch (no secrets; never the default branch)"
        max-time: 15
        script:
          - |
            export GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            export GIZMODUCK_DEFAULT_BRANCH=main
            export GIZMODUCK_SOURCE_REPO=https://github.com/mbadali25/useful-claude-add-ons
            export GIZMODUCK_REF=0123456789abcdef0123456789abcdef01234567
            # No secret is used here, and none should be visible (they are deployment variables).
            unset GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE
          - |
            if [ ! -f "gizmoduck-out/endpoints/security-scan-report.md" ]; then
              echo "gizmoduck: the scan left no security-scan-report.md - nothing to commit (see the run artifacts)"
              exit 0
            fi
            command -v git >/dev/null 2>&1 || { apt-get update -y && apt-get install -y git; }
            cp "gizmoduck-out/endpoints/security-scan-report.md" security-scan-report.md
            export GIZMODUCK_PUBLISH_BRANCH="${BITBUCKET_BRANCH:-}" GIZMODUCK_PUBLISH_FILES=security-scan-report.md \
              GIZMODUCK_PUBLISH_WHAT=security-scan-report.md
            branch="${GIZMODUCK_PUBLISH_BRANCH#refs/heads/}"
            if [ -z "$branch" ] || [ "$branch" = "$GIZMODUCK_DEFAULT_BRANCH" ]; then
              echo "gizmoduck: '${branch:-<no branch>}' is the default branch (or unknown) - verify-only there;" "$GIZMODUCK_PUBLISH_WHAT is not committed"
            else
              # shellcheck disable=SC2086
              git add -- $GIZMODUCK_PUBLISH_FILES
              if git diff --cached --quiet; then
                echo "gizmoduck: $GIZMODUCK_PUBLISH_WHAT unchanged on $branch - nothing to commit"
              elif git log -1 --format=%B | grep -qF '[gizmoduck-self-commit]'; then
                echo "gizmoduck: HEAD is already a gizmoduck self-commit and $GIZMODUCK_PUBLISH_WHAT still differs -"
                echo "refusing to commit again (loop guard). Regenerate it locally and commit the result."
                exit 1
              else
                git -c user.name=gizmoduck-ci -c user.email=gizmoduck-ci@noreply.invalid commit -q       -m "gizmoduck: regenerate $GIZMODUCK_PUBLISH_WHAT [skip ci] [gizmoduck-self-commit]"
                if [ -n "${GIZMODUCK_GIT_AUTH:-}" ]; then
                  push_ok() { git -c "$GIZMODUCK_GIT_AUTH" push -q origin "HEAD:refs/heads/$branch"; }
                else
                  push_ok() { git push -q origin "HEAD:refs/heads/$branch"; }
                fi
                if push_ok; then
                  echo "gizmoduck: $GIZMODUCK_PUBLISH_WHAT committed on $branch"
                else
                  echo "gizmoduck: could not push the $GIZMODUCK_PUBLISH_WHAT commit to $branch (did the branch move?)."
                  echo "  The run for the newer commit regenerates it; or regenerate locally and commit it."
                  exit 1
                fi
              fi
            fi
    - step: &gizmoduck-publish-sweep
        name: "gizmoduck: weekly security-scan-report.md to a results branch (opt-in; never the default branch)"
        max-time: 15
        script:
          - |
            export GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            export GIZMODUCK_DEFAULT_BRANCH=main
            export GIZMODUCK_SOURCE_REPO=https://github.com/mbadali25/useful-claude-add-ons
            export GIZMODUCK_REF=0123456789abcdef0123456789abcdef01234567
            # No secret is used here, and none should be visible (they are deployment variables).
            unset GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE
          - |
            # The weekly sweep's report is always in this run's artifacts (and in Downloads
            # with GIZMODUCK_REPORT_DOWNLOADS=true). A results branch is opt-in:
            # GIZMODUCK_RESULTS_BRANCH names it, and it may not be the default branch or
            # release/* - a sweep never commits to a branch people merge from.
            if [ -z "${GIZMODUCK_RESULTS_BRANCH:-}" ]; then
              echo "gizmoduck: GIZMODUCK_RESULTS_BRANCH is not set - the report stays in this run's artifacts"
              exit 0
            fi
            case "$GIZMODUCK_RESULTS_BRANCH" in
              "$GIZMODUCK_DEFAULT_BRANCH"|release/*|refs/*)
                echo "gizmoduck: refusing results branch '$GIZMODUCK_RESULTS_BRANCH' - not the default branch or release/*"
                exit 1 ;;
            esac
            if [ ! -f "gizmoduck-out/endpoints/security-scan-report.md" ]; then
              echo "gizmoduck: the sweep left no security-scan-report.md - nothing to publish"
              exit 0
            fi
            command -v git >/dev/null 2>&1 || { apt-get update -y && apt-get install -y git; }
            work="$(mktemp -d)"
            if git fetch -q origin "refs/heads/$GIZMODUCK_RESULTS_BRANCH"; then
              git worktree add -q "$work" FETCH_HEAD
            else
              git worktree add -q --detach "$work" HEAD
              git -C "$work" checkout -q --orphan gizmoduck-results-new
              git -C "$work" rm -rqf .
            fi
            cp "gizmoduck-out/endpoints/security-scan-report.md" "$work/security-scan-report.md"
            cd "$work"
            export GIZMODUCK_PUBLISH_BRANCH="$GIZMODUCK_RESULTS_BRANCH" GIZMODUCK_PUBLISH_FILES=security-scan-report.md \
              GIZMODUCK_PUBLISH_WHAT="weekly security-scan-report.md"
            branch="${GIZMODUCK_PUBLISH_BRANCH#refs/heads/}"
            if [ -z "$branch" ] || [ "$branch" = "$GIZMODUCK_DEFAULT_BRANCH" ]; then
              echo "gizmoduck: '${branch:-<no branch>}' is the default branch (or unknown) - verify-only there;" "$GIZMODUCK_PUBLISH_WHAT is not committed"
            else
              # shellcheck disable=SC2086
              git add -- $GIZMODUCK_PUBLISH_FILES
              if git diff --cached --quiet; then
                echo "gizmoduck: $GIZMODUCK_PUBLISH_WHAT unchanged on $branch - nothing to commit"
              elif git log -1 --format=%B | grep -qF '[gizmoduck-self-commit]'; then
                echo "gizmoduck: HEAD is already a gizmoduck self-commit and $GIZMODUCK_PUBLISH_WHAT still differs -"
                echo "refusing to commit again (loop guard). Regenerate it locally and commit the result."
                exit 1
              else
                git -c user.name=gizmoduck-ci -c user.email=gizmoduck-ci@noreply.invalid commit -q       -m "gizmoduck: regenerate $GIZMODUCK_PUBLISH_WHAT [skip ci] [gizmoduck-self-commit]"
                if [ -n "${GIZMODUCK_GIT_AUTH:-}" ]; then
                  push_ok() { git -c "$GIZMODUCK_GIT_AUTH" push -q origin "HEAD:refs/heads/$branch"; }
                else
                  push_ok() { git push -q origin "HEAD:refs/heads/$branch"; }
                fi
                if push_ok; then
                  echo "gizmoduck: $GIZMODUCK_PUBLISH_WHAT committed on $branch"
                else
                  echo "gizmoduck: could not push the $GIZMODUCK_PUBLISH_WHAT commit to $branch (did the branch move?)."
                  echo "  The run for the newer commit regenerates it; or regenerate locally and commit it."
                  exit 1
                fi
              fi
            fi

pipelines:
  default:
    - step: *gizmoduck-inventory-branch
  branches:
    "main":
      - step: *gizmoduck-inventory-verify
  pull-requests:
    '**':
      - step: *gizmoduck-pr-check
  custom:
    security-full:
      - variables:
          - name: GIZMODUCK_TARGET_URL
            default: ""
            description: Base URL to scan instead of the configured staging URL (the guard still applies)
      - stage:
          name: gizmoduck tier 2 (trusted)
          deployment: gizmoduck-trusted
          steps:
            - step: *gizmoduck-full-code
            # If this pipeline also deploys staging, put the deploy step here so the
            # endpoint scan runs against what was just deployed.
            - step: *gizmoduck-endpoint-scan
      - step: *gizmoduck-publish-report
    security-weekly:
      - stage:
          name: gizmoduck tier 3 (trusted)
          deployment: gizmoduck-trusted
          steps:
            - step: *gizmoduck-sweep-code
            - step: *gizmoduck-sweep-endpoints
      - step: *gizmoduck-publish-sweep
    security-full-bootstrap:
      - variables:
          - name: GIZMODUCK_TARGET_URL
            default: ""
            description: Base URL to scan instead of the configured staging URL (the guard still applies)
      - stage:
          name: gizmoduck tier 2 (trusted, inline bootstrap)
          deployment: gizmoduck-trusted
          steps:
            - step:
                <<: *gizmoduck-full-code
                image: ubuntu:24.04
            - step:
                <<: *gizmoduck-endpoint-scan
                image: ubuntu:24.04
      - step:
          <<: *gizmoduck-publish-report
          image: ubuntu:24.04
    security-weekly-bootstrap:
      - stage:
          name: gizmoduck tier 3 (trusted, inline bootstrap)
          deployment: gizmoduck-trusted
          steps:
            - step:
                <<: *gizmoduck-sweep-code
                image: ubuntu:24.04
            - step:
                <<: *gizmoduck-sweep-endpoints
                image: ubuntu:24.04
      - step:
          <<: *gizmoduck-publish-sweep
          image: ubuntu:24.04
