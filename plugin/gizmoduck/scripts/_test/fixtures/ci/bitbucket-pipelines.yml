            # Prod-refusal guard: runs before any endpoint scan and fails the step on a refused target.
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" targets --run-endpoints "$GIZMODUCK_OUT/endpoints-run.json" --out "$GIZMODUCK_OUT/targets.json"
