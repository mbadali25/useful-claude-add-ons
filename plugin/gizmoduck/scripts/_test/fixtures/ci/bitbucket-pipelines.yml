# Rendered by /gizmoduck:ci (gizmoduck 0.0.0-golden).
# Re-render with gizmoduck_ci.py rather than hand-editing; the prod-refusal
# guard's staging origins are baked in below and re-checked at runtime.
#
# Trigger tiers:
#   1  light PR check   pull-requests '**'; blocks on a new Critical. A docs-only PR passes
#                       without a scan - decided from a merge-base diff with the destination,
#                       not `condition.changesets` (which sees only a push's tip commit).
#   2  targeted full    custom: security-full - run it by hand (Pipelines -> Run pipeline -> pick
#                       the branch -> custom: security-full); blocks on a new Critical/High. Set
#                       GIZMODUCK_TARGET_URL to scan another guard-allowed base URL.
#   3  weekly sweep     custom: security-weekly, scheduled - never blocks.
# One-time setup for tier 3 (a schedule cannot be declared in this file):
#   Repository settings -> Pipelines -> Schedules -> New schedule
#   Branch: main   Pipeline: custom: security-weekly   Interval: Weekly, Sunday, 23:00 UTC
# Bitbucket has no PR labels and no cancel-in-progress. Endpoint scans never run on a PR.
#
# One-time setup for trust (the pull-request step refuses to run without it):
#   Repository settings -> Deployments -> add an environment named gizmoduck-trusted
#   and put EVERY secret there as a deployment variable, never as a repository
#   variable: GIZMODUCK_BB_TOKEN (secured; uploads the baseline), SDP_BASE_URL +
#   SDP_API_KEY (secured; tickets), NVD_API_KEY (secured),
#   GIZMODUCK_AUTH_HEADER_VALUE (secured; only when gizmoduck-ci.json sets auth "header").
#   Only the custom pipelines' stages use that environment. A pull request, or a
#   custom run on a branch other than main or release/*, refuses to run if any
#   of those is visible to it. On Premium, restrict the environment's deployment
#   permissions to main - a pull request that edits this file runs whatever it
#   writes, and that restriction is what keeps it from the environment.
# Repository variables: GIZMODUCK_BB_READ_TOKEN (secured; a READ-only access token -
#   baselines and draft detection), GIZMODUCK_ALLOWED_PROD_ORIGINS + GIZMODUCK_ALLOW_PROD_SCAN,
#   GIZMODUCK_ALLOWED_IP_ORIGINS, GIZMODUCK_ALLOW_NO_BASELINE, GIZMODUCK_ALLOW_INCOMPLETE,
#   GIZMODUCK_TRUST_ASSIGNED_SEVERITY, GIZMODUCK_SDP_TICKETS (+ SDP_AUTH_HEADER).
# Caches: the PR step uses gizmoduck-pr-trivy only; trusted steps never restore it.
#
# Generated Markdown (endpoints-inventory.md, security-scan-report.md):
#   default:  every branch but main: regenerate endpoints-inventory.md and commit it ON
#             THE BRANCH. `default:`, not `pull-requests:` - a pull-request pipeline
#             merges main in before it runs (a commit from there would push that
#             merge, and a conflict kills the build) and runs in addition to this one.
#   main: verify-only - `check` fails while endpoints-inventory.md is stale; nothing is
#             pushed (a default branch commonly refuses pushes from Pipelines).
#   custom: security-full commits the scan's security-scan-report.md on the branch it ran on (never
#             main) from a step outside the trusted stage - it holds no secret.
#   custom: security-weekly keeps its report in artifacts; optional: Downloads
#             (GIZMODUCK_REPORT_DOWNLOADS=true) or a results branch (GIZMODUCK_RESULTS_BRANCH,
#             never main or release/*). Never a commit to main.
#   Loop safety: self-commits carry [skip ci] and [gizmoduck-self-commit]; a regeneration that
#   matches commits nothing, and one that still differs on top of a self-commit refuses.
#   A [skip ci] tip has no build of its own; a merge check keyed on the tip's build waits
#   for the next push - commit the regenerated file yourself and no self-commit happens.
image: "ghcr.io/example/gizmoduck-ci:0.0.0-golden"

definitions:
  caches:
    gizmoduck-trivy: /tmp/gizmoduck-cache/trivy
    gizmoduck-nvd: /tmp/gizmoduck-cache/nvd
    gizmoduck-nuclei: /tmp/gizmoduck-cache/nuclei-templates
    gizmoduck-pr-trivy: /tmp/gizmoduck-cache/trivy
  steps:
    - step: &gizmoduck-pr-check
        name: "gizmoduck tier 1: light PR check (blocks on a new Critical)"
        size: 2x
        max-time: 30
        clone:
          depth: full
        caches:
          - gizmoduck-pr-trivy
        script:
          - |
            export GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            export GIZMODUCK_OUT=/tmp/gizmoduck-out/code
            export GIZMODUCK_TIER=light
            export GIZMODUCK_BLOCK_AT=critical
            export GIZMODUCK_AUTHORIZED_BY='Jane Doe (CISO), ticket SEC-42 - '"'"'quoted'"'"' "too"'
            export GIZMODUCK_DEFAULT_BRANCH=main
            export GIZMODUCK_SOURCE_REPO=https://github.com/mbadali25/useful-claude-add-ons
            export GIZMODUCK_REF=0123456789abcdef0123456789abcdef01234567
            export GIZMODUCK_STAGING_URLS=https://staging.example.com
            export GIZMODUCK_ENABLE=nikto,nmap
            export TRIVY_CACHE_DIR=/tmp/gizmoduck-cache/trivy
            export GIZMODUCK_DEPCHECK_DATA=/tmp/gizmoduck-cache/nvd
            export GIZMODUCK_NUCLEI_TEMPLATES=/tmp/gizmoduck-cache/nuclei-templates
            export PATH="$HOME/.local/bin:$PATH"
          - |
            # A pull request is untrusted code: no secret may be visible to it - not a
            # write-capable secret, and not NVD_API_KEY or the scan auth header either.
            # They belong to the gizmoduck-trusted deployment environment, which only the
            # custom pipelines use - one visible here was made a repository variable.
            for v in GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE; do
              if [ -n "$(printenv "$v" || true)" ]; then
                echo "gizmoduck: $v is visible to a pull-request pipeline - it is a repository variable. Move it to the" "gizmoduck-trusted deployment environment (Repository settings -> Deployments); refusing to run with it."
                exit 1
              fi
            done
            unset GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE
            # Tier 1 skips draft PRs. Bitbucket passes no draft flag to a pipeline, so it
            # is read from the pull request with the read-only GIZMODUCK_BB_READ_TOKEN. A
            # state this step cannot read fails the check - a draft is never guessed at.
            if [ -z "${GIZMODUCK_BB_READ_TOKEN:-}" ]; then
              echo "gizmoduck: GIZMODUCK_BB_READ_TOKEN is not available (a fork's pull request never gets secured variables),"
              echo "so this check cannot tell a draft apart or read its baseline - failing rather than scanning blind."
              echo "A maintainer can run custom: security-full on the branch instead."
              exit 1
            fi
            draft="$(curl -fsS -H "Authorization: Bearer $GIZMODUCK_BB_READ_TOKEN" "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/pullrequests/${BITBUCKET_PR_ID:-0}" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("draft", False)).lower())' || echo unknown)"
            case "$draft" in
              true) echo "gizmoduck: draft pull request - tier 1 is skipped until it is marked ready for review"; exit 0 ;;
              false) ;;
              *) echo "gizmoduck: could not read whether pull request ${BITBUCKET_PR_ID:-?} is a draft - failing closed"; exit 1 ;;
            esac
          - |
            # Docs-only? Decided from the merge-base diff with the destination branch -
            # never `condition.changesets`, which sees only a push's tip commit. A
            # docs-only pull request passes this check without a scan.
            git fetch -q origin "$BITBUCKET_PR_DESTINATION_BRANCH" || {
              echo "gizmoduck: could not fetch $BITBUCKET_PR_DESTINATION_BRANCH - cannot tell what changed; failing closed"
              exit 2
            }
            GIZMODUCK_DIFF_BASE=FETCH_HEAD
            if ! mb="$(git merge-base "$GIZMODUCK_DIFF_BASE" HEAD 2>/dev/null)"; then
              echo "gizmoduck: no merge base between $GIZMODUCK_DIFF_BASE and HEAD - cannot tell what changed; failing closed"
              exit 2
            fi
            short="$(printf '%s' "$mb" | cut -c1-12)"
            if ! changed="$(git diff --name-only "$mb" HEAD)"; then
              echo "gizmoduck: git diff $short..HEAD failed - cannot tell what changed; failing closed"
              exit 2
            fi
            scannable=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                *.md|docs/*|*.png|*.jpg|*.gif) ;;
                *) scannable=true; echo "gizmoduck: scannable change since $short: $f"; break ;;
              esac
            done <<GIZMODUCK_CHANGED
            $changed
            GIZMODUCK_CHANGED
            if [ "$scannable" = false ]; then
              echo "gizmoduck: only documentation changed since $short - no scannable changes"
            fi
            if [ "$scannable" = false ]; then
              echo "gizmoduck: check PASS - no scannable changes (documentation only)"
              exit 0
            fi
          - |
            GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
              echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
            else
              echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
              SUDO=""
              if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
              if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
              $SUDO apt-get update -y
              $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
              src="$(mktemp -d)"
              git -C "$src" init -q
              git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
              git -C "$src" checkout -q FETCH_HEAD
              $SUDO rm -rf "$GIZMODUCK_HOME"
              $SUDO cp -r "$src/plugin/gizmoduck" "$GIZMODUCK_HOME"
              PIP_BREAK_SYSTEM_PACKAGES=1 bash "$GIZMODUCK_HOME/bootstrap.sh"
            fi
          - |
            mkdir -p /tmp/gizmoduck-baseline/code "$GIZMODUCK_OUT"
            if [ -n "${GIZMODUCK_BB_READ_TOKEN:-}" ]; then
              curl -fsSL -H "Authorization: Bearer $GIZMODUCK_BB_READ_TOKEN" -o /tmp/gizmoduck-baseline/code/findings.jsonl "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/downloads/gizmoduck-code-baseline.jsonl" || { rm -f /tmp/gizmoduck-baseline/code/findings.jsonl; echo "gizmoduck: no code baseline in Downloads yet"; }
            else
              echo "gizmoduck: GIZMODUCK_BB_READ_TOKEN is not set - no baseline can be read; the gate fails closed on that"
            fi
          - |
            # Diff-aware: everything is measured from the merge base with the PR's destination.
            git fetch -q origin "$BITBUCKET_PR_DESTINATION_BRANCH"
            GIZMODUCK_BASE_SHA="$(git merge-base HEAD FETCH_HEAD)"
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" code-stage --tier light --base-ref "$GIZMODUCK_BASE_SHA" --path "$BITBUCKET_CLONE_DIR" --out "$GIZMODUCK_OUT"
          - |
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" publish --out "$GIZMODUCK_OUT" --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --title 'gizmoduck PR check'
          - |
            gate_rc=0
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gate --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --current "$GIZMODUCK_OUT/findings.jsonl" --manifest "$GIZMODUCK_OUT/run-manifest.json" --block-at "$GIZMODUCK_BLOCK_AT" --json-out "$GIZMODUCK_OUT/gate.json" --new-out "$GIZMODUCK_OUT/new-blocking.jsonl" || gate_rc=$?
          - |
            insights_rc=0
          - |
            # Code Insights: a failure here fails the step (after the gate's own verdict),
            # so a broken report or credential is never a green pipeline with no report.
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" bb-insights "$GIZMODUCK_OUT/findings.jsonl" --gate "$GIZMODUCK_OUT/gate.json" --outdir "$GIZMODUCK_OUT/insights" --srcroot "$BITBUCKET_CLONE_DIR" || insights_rc=$?
            rep="http://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/commit/$BITBUCKET_COMMIT/reports/gizmoduck-code"
            if [ "$insights_rc" -eq 0 ]; then
              curl -fsS --proxy http://localhost:29418 -X PUT "$rep" -H "Content-Type: application/json" --data-binary @"$GIZMODUCK_OUT/insights/report.json" || insights_rc=$?
              for f in "$GIZMODUCK_OUT"/insights/annotations-*.json; do
                [ -f "$f" ] || continue
                curl -fsS --proxy http://localhost:29418 -X POST "$rep/annotations" -H "Content-Type: application/json" --data-binary @"$f" || insights_rc=$?
              done
            fi
          - |
            mkdir -p "$BITBUCKET_CLONE_DIR/gizmoduck-out"
            cp -r "$GIZMODUCK_OUT" "$BITBUCKET_CLONE_DIR/gizmoduck-out/code"
            if [ "$gate_rc" -ne 0 ]; then exit "$gate_rc"; fi
            if [ "$insights_rc" -ne 0 ]; then
              echo "gizmoduck: Code Insights report failed (exit $insights_rc) - failing the step"
              exit "$insights_rc"
            fi
        artifacts:
          - gizmoduck-out/**
    - step: &gizmoduck-full-code
        name: "gizmoduck tier 2: full code scan (Semgrep, Trivy, Checkov, gitleaks)"
        size: 2x
        max-time: 120
        clone:
          depth: full
        caches:
          - gizmoduck-trivy
        script:
          - |
            export GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            export GIZMODUCK_OUT=/tmp/gizmoduck-out/code
            export GIZMODUCK_TIER=full
            export GIZMODUCK_BLOCK_AT=high
            export GIZMODUCK_AUTHORIZED_BY='Jane Doe (CISO), ticket SEC-42 - '"'"'quoted'"'"' "too"'
            export GIZMODUCK_DEFAULT_BRANCH=main
            export GIZMODUCK_SOURCE_REPO=https://github.com/mbadali25/useful-claude-add-ons
            export GIZMODUCK_REF=0123456789abcdef0123456789abcdef01234567
            export GIZMODUCK_STAGING_URLS=https://staging.example.com
            export GIZMODUCK_ENABLE=nikto,nmap
            export TRIVY_CACHE_DIR=/tmp/gizmoduck-cache/trivy
            export GIZMODUCK_DEPCHECK_DATA=/tmp/gizmoduck-cache/nvd
            export GIZMODUCK_NUCLEI_TEMPLATES=/tmp/gizmoduck-cache/nuclei-templates
            export PATH="$HOME/.local/bin:$PATH"
          - |
            # Secrets (gizmoduck-trusted deployment variables) are used only on a trusted
            # branch: the default branch or release/*. A custom run on any other branch
            # refuses if ANY of them is visible - dropping some and keeping the rest is how
            # the deployment secrets reached a feature branch's staging code before.
            case "${BITBUCKET_BRANCH:-}" in
              "$GIZMODUCK_DEFAULT_BRANCH"|release/*) ;;
              *) for v in GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE; do
                   if [ -n "$(printenv "$v" || true)" ]; then
                     echo "gizmoduck: '${BITBUCKET_BRANCH:-<none>}' is not a trusted branch and $v is visible to it -" "refusing to run. Run custom pipelines on the default branch or release/*, or (Premium) restrict the" "gizmoduck-trusted deployment environment to them."
                     exit 1
                   fi
                 done
                 echo "gizmoduck: '${BITBUCKET_BRANCH:-<none>}' is not a trusted branch - running with no secrets"
                 unset GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE ;;
            esac
          - |
            GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
              echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
            else
              echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
              SUDO=""
              if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
              if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
              $SUDO apt-get update -y
              $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
              src="$(mktemp -d)"
              git -C "$src" init -q
              git -C "$src" fetch -q --depth 1 "$GIZMODUCK_SOURCE_REPO" "$GIZMODUCK_REF"
              git -C "$src" checkout -q FETCH_HEAD
              $SUDO rm -rf "$GIZMODUCK_HOME"
              $SUDO cp -r "$src/plugin/gizmoduck" "$GIZMODUCK_HOME"
              PIP_BREAK_SYSTEM_PACKAGES=1 bash "$GIZMODUCK_HOME/bootstrap.sh"
            fi
          - |
            mkdir -p /tmp/gizmoduck-baseline/code "$GIZMODUCK_OUT"
            if [ -n "${GIZMODUCK_BB_READ_TOKEN:-}" ]; then
              curl -fsSL -H "Authorization: Bearer $GIZMODUCK_BB_READ_TOKEN" -o /tmp/gizmoduck-baseline/code/findings.jsonl "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/downloads/gizmoduck-code-baseline.jsonl" || { rm -f /tmp/gizmoduck-baseline/code/findings.jsonl; echo "gizmoduck: no code baseline in Downloads yet"; }
            else
              echo "gizmoduck: GIZMODUCK_BB_READ_TOKEN is not set - no baseline can be read; the gate fails closed on that"
            fi
          - |
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" code-stage --tier "$GIZMODUCK_TIER" --path "$BITBUCKET_CLONE_DIR" --out "$GIZMODUCK_OUT"
          - |
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" publish --out "$GIZMODUCK_OUT" --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --title 'gizmoduck full code scan'
          - |
            gate_rc=0
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" gate --baseline /tmp/gizmoduck-baseline/code/findings.jsonl --current "$GIZMODUCK_OUT/findings.jsonl" --manifest "$GIZMODUCK_OUT/run-manifest.json" --block-at "$GIZMODUCK_BLOCK_AT" --json-out "$GIZMODUCK_OUT/gate.json" --new-out "$GIZMODUCK_OUT/new-blocking.jsonl" || gate_rc=$?
          - |
            insights_rc=0
          - |
            # Code Insights: a failure here fails the step (after the gate's own verdict),
            # so a broken report or credential is never a green pipeline with no report.
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" bb-insights "$GIZMODUCK_OUT/findings.jsonl" --gate "$GIZMODUCK_OUT/gate.json" --outdir "$GIZMODUCK_OUT/insights" --srcroot "$BITBUCKET_CLONE_DIR" || insights_rc=$?
            rep="http://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/commit/$BITBUCKET_COMMIT/reports/gizmoduck-code"
            if [ "$insights_rc" -eq 0 ]; then
              curl -fsS --proxy http://localhost:29418 -X PUT "$rep" -H "Content-Type: application/json" --data-binary @"$GIZMODUCK_OUT/insights/report.json" || insights_rc=$?
              for f in "$GIZMODUCK_OUT"/insights/annotations-*.json; do
                [ -f "$f" ] || continue
                curl -fsS --proxy http://localhost:29418 -X POST "$rep/annotations" -H "Content-Type: application/json" --data-binary @"$f" || insights_rc=$?
              done
            fi
          - |
            # The next baseline: the weekly sweep's results (it never blocks), or a clean
            # tier-2 run - both only on the default branch, never from a pull request.
            if { [ "$GIZMODUCK_TIER" = "sweep" ] || [ "$gate_rc" -eq 0 ]; } && [ "${BITBUCKET_BRANCH:-}" = "$GIZMODUCK_DEFAULT_BRANCH" ] && [ -z "${BITBUCKET_PR_ID:-}" ] && [ -n "${GIZMODUCK_BB_TOKEN:-}" ]; then
              curl -fsS -X POST -H "Authorization: Bearer $GIZMODUCK_BB_TOKEN" -F "files=@$GIZMODUCK_OUT/findings.jsonl;filename=gizmoduck-code-baseline.jsonl" "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/downloads" || echo "gizmoduck: baseline upload failed - the next run compares against the previous baseline"
            fi
          - |
            if [ -z "${BITBUCKET_PR_ID:-}" ] && [ "${GIZMODUCK_SDP_TICKETS:-}" = "true" ] && [ -n "${SDP_API_KEY:-}" ] && [ -s "$GIZMODUCK_OUT/new-blocking.jsonl" ]; then
              python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" tickets "$GIZMODUCK_OUT/new-blocking.jsonl" --out "$GIZMODUCK_OUT/tickets.json" --yes || echo "gizmoduck: ticketing failed"
            fi
          - |
            mkdir -p "$BITBUCKET_CLONE_DIR/gizmoduck-out"
            cp -r "$GIZMODUCK_OUT" "$BITBUCKET_CLONE_DIR/gizmoduck-out/code"
            if [ "$gate_rc" -ne 0 ]; then exit "$gate_rc"; fi
            if [ "$insights_rc" -ne 0 ]; then
              echo "gizmoduck: Code Insights report failed (exit $insights_rc) - failing the step"
              exit "$insights_rc"
            fi
        artifacts:
          - gizmoduck-out/**
    - step: &gizmoduck-endpoint-scan
        name: "gizmoduck tier 2: staging endpoint scan (Nuclei, ZAP baseline, testssl, nikto, nmap)"
        size: 2x
        max-time: 120
        caches:
          - gizmoduck-nuclei
        script:
          - |
            export GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            export GIZMODUCK_OUT=/tmp/gizmoduck-out/endpoints
            export GIZMODUCK_TIER=full
            export GIZMODUCK_BLOCK_AT=high
            export GIZMODUCK_AUTHORIZED_BY='Jane Doe (CISO), ticket SEC-42 - '"'"'quoted'"'"' "too"'
            export GIZMODUCK_DEFAULT_BRANCH=main
            export GIZMODUCK_SOURCE_REPO=https://github.com/mbadali25/useful-claude-add-ons
            export GIZMODUCK_REF=0123456789abcdef0123456789abcdef01234567
            export GIZMODUCK_STAGING_URLS=https://staging.example.com
            export GIZMODUCK_ENABLE=nikto,nmap
            export TRIVY_CACHE_DIR=/tmp/gizmoduck-cache/trivy
            export GIZMODUCK_DEPCHECK_DATA=/tmp/gizmoduck-cache/nvd
            export GIZMODUCK_NUCLEI_TEMPLATES=/tmp/gizmoduck-cache/nuclei-templates
            export PATH="$HOME/.local/bin:$PATH"
          - |
            # Secrets (gizmoduck-trusted deployment variables) are used only on a trusted
            # branch: the default branch or release/*. A custom run on any other branch
            # refuses if ANY of them is visible - dropping some and keeping the rest is how
            # the deployment secrets reached a feature branch's staging code before.
            case "${BITBUCKET_BRANCH:-}" in
              "$GIZMODUCK_DEFAULT_BRANCH"|release/*) ;;
              *) for v in GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE; do
                   if [ -n "$(printenv "$v" || true)" ]; then
                     echo "gizmoduck: '${BITBUCKET_BRANCH:-<none>}' is not a trusted branch and $v is visible to it -" "refusing to run. Run custom pipelines on the default branch or release/*, or (Premium) restrict the" "gizmoduck-trusted deployment environment to them."
                     exit 1
                   fi
                 done
                 echo "gizmoduck: '${BITBUCKET_BRANCH:-<none>}' is not a trusted branch - running with no secrets"
                 unset GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE ;;
            esac
          - |
            GIZMODUCK_HOME="${GIZMODUCK_HOME:-/opt/gizmoduck}"
            if [ -f "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" ]; then
              echo "gizmoduck: toolchain present at $GIZMODUCK_HOME (runner image)"
            else
              echo "gizmoduck: runner image not in use - inline bootstrap from $GIZMODUCK_SOURCE_REPO@$GIZMODUCK_REF (slow; build the image to skip this)"
              SUDO=""
              if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
              if ! command -v sudo >/dev/null 2>&1; then apt-get update -y && apt-get install -y sudo; fi
              $SUDO apt-get update -y
              $SUDO apt-get install -y ca-certificates curl git unzip python3 python3-pip python3-yaml
