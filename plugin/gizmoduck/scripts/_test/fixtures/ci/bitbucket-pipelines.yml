            fi
          - |
            if [ -z "${BITBUCKET_PR_ID:-}" ] && [ "${GIZMODUCK_SDP_TICKETS:-}" = "true" ] && [ -n "${SDP_API_KEY:-}" ] && [ -s "$GIZMODUCK_OUT/new-blocking.jsonl" ]; then
