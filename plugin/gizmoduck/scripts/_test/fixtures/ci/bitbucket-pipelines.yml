              *) for v in GIZMODUCK_BB_TOKEN SDP_API_KEY SDP_BASE_URL NVD_API_KEY GIZMODUCK_AUTH_HEADER_VALUE; do
                   if [ -n "$(printenv "$v" || true)" ]; then
                     echo "gizmoduck: '${BITBUCKET_BRANCH:-<none>}' is not a trusted branch and $v is visible to it -" "refusing to run. Run custom pipelines on the default branch or release/*, or (Premium) restrict the" "gizmoduck-trusted deployment environment to them."
                     exit 1
