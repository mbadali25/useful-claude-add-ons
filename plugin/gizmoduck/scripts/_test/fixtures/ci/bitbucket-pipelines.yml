            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" prepare-templates --dir "$GIZMODUCK_NUCLEI_TEMPLATES" --tier "$GIZMODUCK_TIER"
          - |
            # Endpoints: the committed list merged with a cheap re-detect. None at all
            # is UNVERIFIED and fails here - an empty scan never passes.
            mkdir -p "$GIZMODUCK_OUT"
            python3 "$GIZMODUCK_HOME/scripts/gizmoduck_ci.py" endpoints --config "$BITBUCKET_CLONE_DIR/gizmoduck-ci.json" --repo "$BITBUCKET_CLONE_DIR" --out "$GIZMODUCK_OUT"
