name: Shell suites (skills)

# push alone tests the branch tip, never the merge result a PR would produce.
# Matches marketplace.yml and mcp-servers.yml, which already declare both.
on: [push, pull_request]

# New file, not a pattern match: before this there was NO workflow in this repo
# that ran a bash-driven suite. pytest-crew.yml runs pytest and cannot collect a
# `.sh`, so these two suites -- both committed, both green -- had never once been
# executed by CI. A regression suite CI never runs is a check that has never been
# shown to fail.
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # doc-builder's checklist.sh resolves python3/python/py itself and
          # fails loudly if none is on PATH. It runs build_report.py, whose
          # HTML path is stdlib-only -- nothing in requirements.txt (python-docx,
          # pywin32, PyMuPDF, Pillow, numpy) is imported on the way to the .html
          # this suite inspects, so there is no pip step here on purpose.
          python-version: "3.13"
      # Each suite is its own step so a failure names which one failed in the
      # job summary rather than collapsing into one red "run the suites" line.
      # Both exit non-zero on failure and create nothing outside their own
      # `mktemp -d`; neither reads credentials or opens a socket. bitbucket's
      # points merge_gate.sh at _test/stub_bb.sh through BB_CMD, so bb.sh and
      # BITBUCKET_* are never touched.
      - name: bitbucket -- merge_gate dry-run checks
        # jq is preinstalled on ubuntu-latest; merge_gate.sh exits 1 with
        # "jq is not on PATH" rather than silently skipping if that changes.
        run: bash skills/bitbucket/scripts/_test/merge_gate.sh
      - name: doc-builder -- emitted-report checklist
        run: bash skills/doc-builder/scripts/_test/checklist.sh
      # vault_guard.py (this plugin's one blocking hook) plus the vault-resolution
      # and REST-bridge suites, all driven through this one entrypoint.
      # 16.8s measured here 2026-09-22, own temp HOME, no live Obsidian, no
      # sockets. The suite's own final "RESULT: N passed" line is the count
      # to trust - a number restated here would drift out from under this
      # comment the next time a case is added, so it is deliberately not
      # restated (CLAUDE.md's "a self-referential count changes itself").
      # Its own .ps1 sub-cases (test_vault_guard_sh.sh,
      # test_bridge_capture_sh.sh, test_ps1_legacy_args.sh, the flavour guard)
      # resolve pwsh via a bare `command -v pwsh`; GitHub's ubuntu-latest image
      # ships pwsh at /usr/bin/pwsh (see the "PowerShell static checks" step in
      # marketplace.yml, which already relies on it), so those sub-cases are
      # expected to run here, not skip. run-tests.sh itself now exits 77, not
      # 0, when a sub-case skipped for a missing tool and nothing FAILED (same
      # convention render.sh uses for a missing mmdc) - but GitHub Actions has
      # no SKIP status for a step: ANY nonzero exit, 77 included, fails the
      # step and turns the job red. That is the INTENDED behaviour here, not a
      # gap to paper over with continue-on-error: this runner is expected to
      # carry pwsh, so its absence is a real problem with the runner image,
      # not a soft "some cases didn't run" note. If this step ever goes red,
      # read the log first - exit 77 here means TOOL MISSING on the runner,
      # not a failed test, so do not chase it as a code regression before
      # checking whether pwsh is still on this image. Was green locally and
      # run by nothing until this line - this plugin's own suite had no CI
      # step at all before, only `claude plugin validate` in marketplace.yml.
      - name: obsidian-vault -- hook and bridge regression suite
        run: bash plugin/obsidian-vault/hooks/scripts/_test/run-tests.sh
      # jira-api.sh's behaviour with jq absent (the same "exit 0 while sending a
      # malformed request" shape as the uv PEP-668 defect, shipped three times).
      # 31 assertions, 0.16s measured here 2026-09-22. HERMETIC: curl is a
      # recording stub that contacts nothing, JIRA_* env vars are unset and
      # replaced with fixture.example.invalid values before anything is
      # sourced, and jq is either symlinked from the real binary or genuinely
      # absent from PATH - never the real Jira Cloud API. jq is preinstalled on
      # ubuntu-latest (same as the bitbucket step above), so this is expected
      # to run the whole suite. The suite's own top-level guard now exits 77,
      # not 127, when jq is absent (this repo's SKIP convention) - but GitHub
      # Actions has no SKIP status for a step: ANY nonzero exit, 77 included,
      # fails the step and turns the job red. That is the INTENDED behaviour
      # here, not a gap to paper over with continue-on-error: this runner is
      # expected to carry jq, so its absence is a real problem with the
      # runner image, not something to tolerate silently. If this step ever
      # goes red, read the log first - exit 77 here means TOOL MISSING on the
      # runner, not a failed test, so do not chase it as a code regression
      # before checking whether jq is still on this image. A SEPARATE step,
      # not folded into pytest-crew.yml's combined run: this suite is bash,
      # not pytest, so the context.py sys.modules collision that step list
      # works around does not apply, but jira-manager carries no conftest.py
      # either and this repo's own convention (bitbucket, doc-builder, above)
      # is one step per bash suite regardless.
      - name: jira-manager -- jq-absence regression suite
        run: bash skills/jira-manager/scripts/_test/jq_absence.sh
