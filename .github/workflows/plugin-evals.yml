name: crew plugin evals

# Real model calls, billed to whoever's ANTHROPIC_API_KEY runs the job - not
# a free structural check like the other workflows here, so this does NOT
# use the repo's usual `on: [push, pull_request]`. It runs only on a PR that
# actually touches the plugin under test, and only when a repo secret named
# ANTHROPIC_API_KEY exists; the skip step below prints why rather than
# failing silently or leaving the check missing.
on:
  pull_request:
    paths:
      - 'plugin/crew/**'
      - 'scripts/run-plugin-evals.sh'
      - 'scripts/run-plugin-evals.ps1'
      - '.github/workflows/plugin-evals.yml'
  workflow_dispatch: {}

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for ANTHROPIC_API_KEY
        id: key-check
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set as a repository secret, so the plugin eval suite (real, billed model calls) was SKIPPED, not passed. The repo owner must add it under Settings > Secrets and variables > Actions for this job to actually run." >&2
          fi

      - name: Set up Node.js
        if: steps.key-check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        if: steps.key-check.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install the Bash sandbox backend (bubblewrap + socat)
        # developer-runs-command-in-foreground grants Bash, and granting Bash
        # needs an OS sandbox backend or claude plugin eval refuses that run
        # outright - see plugin/crew/README.md#running-the-plugin-behavior-evals
        # and https://code.claude.com/docs/en/sandboxing.
        if: steps.key-check.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat

      - name: Run the crew plugin eval suite
        if: steps.key-check.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_OUTPUT_DIR: ${{ github.workspace }}/.work/plugin-evals
        run: bash scripts/run-plugin-evals.sh

      - name: Upload eval results
        if: steps.key-check.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-results
          path: |
            .work/plugin-evals/
            plugin/crew/evals/results/
          if-no-files-found: ignore
