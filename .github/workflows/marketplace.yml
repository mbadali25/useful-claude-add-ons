name: Marketplace

# push runs only on main: a feature branch is tested by its pull_request run
# (the merge result), not twice. pull_request alone would never test main
# itself after a merge, so both are declared.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR at a time: a new push to the PR cancels the superseded run.
# Every non-PR run (push to main, schedule, workflow_dispatch) gets its own
# group via run_id, so nothing on main is ever cancelled or queued behind
# another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-drift check walks the history of marketplace.json to find where
          # each plugin's declared version was last set, so a shallow clone cannot
          # answer it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PyYAML is NOT optional here. `validate-prompts.py` parses frontmatter
      # with it so its parse is no weaker than the loader's; without it that
      # script now exits 1 rather than falling back to a line-splitter that
      # reports passes for files Claude Code refuses to load. Declared as its
      # own step so a missing dependency reads as a setup failure rather than
      # as the validation failing.
      - name: Install the validator's dependency
        run: python -m pip install --upgrade pip pyyaml
      - name: Check the marketplace is internally consistent
        run: python3 scripts/check-marketplace.py
      # check_argument_hint_frontmatter parses every command's and skill's
      # frontmatter with the same PyYAML loader Claude Code uses, so a value
      # like `argument-hint: [a] [b]` - two unquoted bracket groups, read as
      # a flow sequence plus trailing garbage - fails here instead of
      # shipping a file that loads with silently empty frontmatter.
      # `localgpu` 0.1.19 and `obsidian-vault` 0.3.9 shipped exactly that;
      # `claude plugin validate` found it, this repo's own gate did not.
      - name: argument-hint frontmatter suite
        run: python3 scripts/_test/argument-hint-frontmatter.py
      # check_self_claims is mostly valuable for what it stays quiet about, and
      # a check that has gone silent looks exactly like a clean repo. This suite
      # asserts the silence as well as the failures, so a future edit that makes
      # it start guessing which numbers are claims fails here instead of failing
      # a correct line six months from now.
      - name: Self-claim marker suite
        run: python3 scripts/_test/self-claims.py
      # check_crew_ignore_policy is marker-keyed for the same reason and has the
      # same failure mode: a file that mentions one `.crew/` path in passing must
      # NOT be read as declaring the list, or the check starts failing correct
      # lines. Three ways it could pass while checking nothing - an empty
      # extraction, every marker deleted, `.crew/` with a trailing slash that
      # kills every negation below it - each get a case here.
      - name: crew ignore-policy suite
        run: python3 scripts/_test/crew-ignore-policy.py
      # check_verifying_doc: every path VERIFYING.md names exists. Must-fail cases
      # include a misspelt top-level directory and a path inside a fenced block.
      - name: VERIFYING.md path suite
        run: python3 scripts/_test/verifying-doc.py
      # check_diagram_embeds (T-0035): a README's generated crew-diagrams section
      # matches its .mmd. Must-fail cases: a hand edit, a source not re-embedded,
      # a deleted marker, an unreadable source; must-pass: a never-embedded README.
      - name: Diagram embed suite
        run: python3 scripts/_test/check-diagram-embeds.py
      # The version-drift check resolves "when was this version set" by walking
      # marketplace.json's history, and that walk is only monotonic on a linear
      # one. Across a merge it can stop at the merge commit, which then diffs
      # against its own tree and reports nothing - a missing answer wearing the
      # label of a check that ran. crew 0.19.29 shipped that way. The six cases
      # here are commit SHAPES, including the refs/pull/N/merge shape this
      # workflow itself is judged on, and two of them exist to break a
      # different half of the fix.
      - name: Version-drift commit-shape suite
        run: python3 scripts/_test/version-drift.py
      # The fan-in behind the required `crew-shell-matrix (windows-latest)`
      # check (pytest-crew.yml's crew-windows-gate). Each case is one way a
      # test could be lost, or a Windows job not run, while that check went
      # green (L-0577).
      - name: Windows shard fan-in suite
        run: python3 scripts/_test/windows-shards.py
      # scripts/ci-select.py decides which heavy suites a PR runs in
      # pytest-crew.yml, pylint.yml, shell-suites.yml and mcp-servers.yml
      # (C-0001). A wrong answer there is a suite skipped on a PR that needed
      # it, so this always runs, whatever the PR changes.
      # One case collects pytest-crew.yml's whole combined run to measure its
      # sys.path, and fails on a collection error (an incomplete
      # measurement), so it needs that job's test dependencies.
      - name: Install the combined run's test dependencies
        run: python -m pip install 'pytest~=8.0' pytest-xdist pyyaml python-docx numpy pillow requests
      - name: CI suite selector suite
        run: python3 scripts/_test/ci-select.py
      # The UPDATE.md mirrors and the root README's "What's new" (the newest
      # CHANGELOG.md entries) are generated, so the only thing keeping them
      # honest is a gate that fails. Without this step the generator's --check
      # mode is a check nobody runs, which is worse than no check: the blocks
      # carry a "generated" comment that says they are current.
      - name: Generated README blocks are current
        run: python3 scripts/sync-updates.py --check
      # Must-block: a "What's new" that is not the newest two changelog
      # entries fails --check. Must-allow: a fresh render passes (L-1518).
      - name: sync-updates suite
        run: python3 scripts/_test/sync-updates.py
      - name: Shell syntax
        run: bash -n scripts/install-prerequisites.sh
      # An own-line `# shellcheck` comment ShellCheck cannot parse is SC1073, and
      # ShellCheck then stops checking the WHOLE file. install-prerequisites.sh
      # and scripts/_test/lsp-stack-tools.sh were unchecked that way until L-0587.
      # The suite's grammar check is stdlib; its cross-check uses the runner
      # image's own shellcheck (0.9.0 on ubuntu-24.04) and prints SKIPPED only
      # where shellcheck is absent.
      - name: ShellCheck directive suite
        run: python3 scripts/_test/shellcheck-directives.py
      # Runs here because it needs nothing but bash: the end-to-end cases use --dry-run
      # or a stub 'claude'. The drift suite is the one that cannot - it drives the real
      # Claude Code CLI.
      - name: Sub-picker group regression suite
        run: ./scripts/_test/menu-groups.sh
      # Guards the guard below: the PowerShell step only catches a typo'd cmdlet for
      # names that are not exempt, and $externallyProvided is where a name stops being
      # checked. Left flat, the 23 Exchange/AD entries exempted those names repo-wide.
      # Runs here because pwsh is on this runner (the step below uses it) and the suite
      # only parses fixtures under mktemp - it installs nothing and executes no .ps1.
      # Invoked through `bash` rather than as ./script, like the crew suite below:
      # core.filemode is false on the Windows clone this was added from, so git records
      # a new .sh as 100644 and `./script` would be a permission denied on the runner.
      - name: PowerShell exemption scoping suite
        run: bash scripts/_test/check-powershell.sh
      # The launcher every repo gate starts pwsh through (T-0506): a private,
      # throwaway startup-profile cache per run. The suite uses a stub pwsh under
      # mktemp, plus one case with the runner's real pwsh.
      - name: pwsh private-cache launcher suite
        run: bash scripts/_test/pwsh-isolated.sh
      # Reports SKIPPED here and does its checking on a Windows machine: it is the one
      # suite that RUNS install-prerequisites.ps1, which evaluates Test-Admin at top
      # level and so cannot start on this runner. Listed anyway - a Windows-only check
      # that appears in no CI step list is one nobody knows to run.
      - name: PowerShell install-script key handling
        run: bash scripts/_test/ps-install-keys.sh
      # Regression suite for ensure_uv (.sh) and Install-Uv (.ps1): the PEP 668
      # externally-managed-environment defect that shipped three times because
      # two of three call sites never looked at pip's exit status. 162
      # assertions, 4.5s measured here 2026-09-22. Every tool it shells out to
      # (pipx, pip3, curl, apt-get, dnf, ...) is a throwaway stub under mktemp
      # with PATH and HOME repointed at it, so this reaches neither the
      # runner's real Python nor astral.sh. Cases 21-25 drive the .ps1 half
      # under pwsh: GitHub's ubuntu-latest image ships pwsh at /usr/bin/pwsh
      # (same as the "PowerShell static checks" step below, which already
      # relies on it), so those cases are expected to run here, not skip. The
      # suite itself now exits 77, not 0, if pwsh is ever absent and nothing
      # else failed (this repo's SKIP convention) - but GitHub Actions has no
      # SKIP status for a step: ANY nonzero exit, 77 included, fails the step
      # and turns the job red. That is the INTENDED behaviour here, not a gap
      # to paper over with continue-on-error: this runner is expected to
      # carry pwsh, so its absence is a real problem with the runner image.
      # If this step ever goes red, read the log first - exit 77 here means
      # TOOL MISSING on the runner, not a failed test, so do not chase it as
      # a code regression before checking whether pwsh is still on this
      # image. Was green locally and executed by nothing until this line -
      # see TODO.md "Two shell suites under scripts/_test/ are run by nothing".
      - name: uv install regression suite
        run: bash scripts/_test/uv-install.sh
      # Regression suite for three defects in the SAME matched pair: MCP
      # registration reporting success for a server whose launcher can never
      # start, a skill's own Python dependencies never being reported, and the
      # community-marketplace local-name trap (writing the repo name where the
      # marketplace's registered name belongs passes silently forever). 122
      # assertions, 2.4s measured here 2026-09-22. Same stub-everything
      # harness as the uv suite above - installs nothing, registers no
      # marketplace, adds no MCP server, touches no real config. Companion to
      # the suite above; was equally green and equally unrun before this line.
      # Case 24 drives the .ps1 half under pwsh and carries the same exit-77
      # behaviour and the same consequence on this runner: a red step here
      # after a runner-image change means TOOL MISSING (pwsh), not a code
      # regression - see the uv suite's comment above for the full reasoning.
      - name: MCP preflight/catalog regression suite
        run: bash scripts/_test/mcp-preflight-catalog.sh
      # The crew hooks can BLOCK a turn, so their regression suite is the one check
      # here whose absence is invisible: a gate that stops gating still exits 0. It
      # builds throwaway git repos under mktemp and installs nothing.
      - name: crew hook regression suite
        run: bash plugin/crew/hooks/scripts/_test/run-tests.sh
      # Frontmatter, tool permissions and every ${CLAUDE_PLUGIN_ROOT} path referenced
      # by a command, agent or skill. A command that names a script that does not
      # exist fails at the worst possible moment - when somebody runs it.
      - name: crew prompt validation
        run: python3 hooks/scripts/_test/validate-prompts.py
        working-directory: plugin/crew
      # Not just a parse: every .ps1 here is Windows-only end to end, so a call to a
      # function that does not exist parses cleanly and only fails on the one platform
      # nothing here can run. check-powershell.ps1 resolves every Verb-Noun call in
      # every tracked .ps1 - the crew hook scripts included, since those run from a
      # hook on someone else's machine where a thrown exception is invisible.
      - name: PowerShell static checks
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      # claude plugin validate loads each manifest with the CLI's own parser,
      # which is a different (and stricter) code path than check-marketplace.py's
      # regex/YAML checks above - it is what caught the argument-hint bug this
      # step guards against. Installed via npm per the documented CI-friendly
      # method (https://code.claude.com/docs/en/setup#install-with-npm); pinned
      # to the version this fix was verified against so a CLI regression shows
      # up as a version bump here, not a silent behaviour change.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.278
      # _verify/smoke.sh holds two checks no other step runs: the crew-setup
      # canon() round-trip and version agreement across pyproject.toml,
      # plugin.json, marketplace.json and every Python-source copy. It runs
      # after the CLI install so its own `claude plugin validate` check runs
      # rather than skipping. Found by crew's QA audit (L-0618, item E7).
      - name: Smoke checks (_verify/smoke.sh)
        run: bash _verify/smoke.sh
      - name: claude plugin validate --strict
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugin/crew
          claude plugin validate --strict plugin/gizmoduck
          claude plugin validate --strict plugin/rule-of-two
          claude plugin validate --strict plugin/localgpu
          claude plugin validate --strict plugin/obsidian-vault
          # skills/* have no per-directory manifest to validate; the
          # marketplace-root call above covers them.
