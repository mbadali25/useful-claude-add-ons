name: Pylint

# push runs only on main: a feature branch is tested by its pull_request run
# (the merge result), not twice. pull_request alone would never test main
# itself after a merge, so both are declared.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly full-matrix run: PRs test Python 3.12 only (see RUN_LEG below),
  # so 3.11/3.13 are covered here and on every push to main.
  schedule:
    - cron: '17 7 * * *'

# One run per PR at a time: a new push to the PR cancels the superseded run.
# Every non-PR run (push to main, schedule, workflow_dispatch) gets its own
# group via run_id, so nothing on main is ever cancelled or queued behind
# another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other versions the moment one fails -- when a check is
      # version-specific, seeing the whole matrix is what tells you that.
      fail-fast: false
      matrix:
        # 3.8 and 3.9 are both past end-of-life, and pylint 4 requires >=3.10.
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # PR CI runs Python 3.12 only; push to main, workflow_dispatch and the
      # nightly schedule run the whole matrix. The 3.11/3.13 legs still EXIST
      # on a PR, because branch protection requires their check names: a
      # job-level `if:` cannot read `matrix`, so every step below is gated on
      # this instead and those legs finish green in seconds having run nothing
      # but the notice step. Env values are strings, hence == 'true'.
      RUN_LEG: ${{ github.event_name != 'pull_request' || matrix.python-version == '3.12' }}
    steps:
    - name: Python ${{ matrix.python-version }} leg SKIPPED on pull_request
      if: env.RUN_LEG != 'true'
      run: echo "::notice::PR CI runs Python 3.12 only. This ${{ matrix.python-version }} leg was SKIPPED, not passed; it runs on push to main, workflow_dispatch and the nightly schedule."
    - uses: actions/checkout@v4
      if: env.RUN_LEG == 'true'
      with:
        # The PR merge commit and its first parent: what ci-select diffs.
        fetch-depth: 2
    - name: Set up Python ${{ matrix.python-version }}
      if: env.RUN_LEG == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Select the suites this PR changes (C-0001)
      id: select
      if: env.RUN_LEG == 'true'
      # scripts/ci-select.py, the one rule pytest-crew.yml, shell-suites.yml
      # and mcp-servers.yml read too. `lint` is false only on a pull request
      # whose every change is a plain document or a non-Python file inside a
      # plugin or skill; any other path, a non-PR event or a diff it cannot
      # compute selects it. A skip is a ::notice::, not a pass.
      run: python3 scripts/ci-select.py --event "${{ github.event_name }}" --output "$GITHUB_OUTPUT"
    - name: Install dependencies
      if: env.RUN_LEG == 'true' && steps.select.outputs.lint != 'false'
      run: |
        python -m pip install --upgrade pip
        # Pinned so CI and a dev machine agree. A new pylint minor adds checks,
        # which would otherwise fail this job on code nobody touched.
        pip install 'pylint~=4.0'
    - name: Analysing the code with pylint
      if: env.RUN_LEG == 'true' && steps.select.outputs.lint != 'false'
      run: |
        pylint --version
        # Config is .pylintrc at the repo root; it documents why each disabled
        # check doesn't fit a repo of standalone skill scripts. Third-party deps
        # are deliberately not installed -- see ignored-modules there.
        # -j: one worker per CPU. Measured 2026-09-29 on a 4-CPU container:
        # 148s serial, 34s at -j 4, byte-identical findings (duplicate-code,
        # the one check -j changes, is disabled in .pylintrc). The count comes
        # from os.cpu_count() rather than `-j 0` because pylint's own
        # detection read that same container as 1 CPU and ran serially.
        pylint -j "$(python -c 'import os; print(os.cpu_count() or 1)')" $(git ls-files '*.py')

  ruff:
    # Until crew 1.0.62 no workflow ran ruff, while .crew/verify.json told every
    # reader "CI still runs it". The local gate skips it (exit 77) wherever ruff
    # is not installed, so nothing caught nine findings that landed in shipped
    # crew scripts. One job, not a matrix: ruff does not execute the code it
    # checks, so the interpreter version does not change its result.
    #
    # Pinned like pylint above. ruff.toml also names its rule set explicitly
    # (`select`), because ruff 0.16 widened the DEFAULT set and an unpinned
    # install with no `select` reported 1493 findings on untouched code.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Select the suites this PR changes (C-0001)
      id: select
      run: python3 scripts/ci-select.py --event "${{ github.event_name }}" --output "$GITHUB_OUTPUT"
    - name: Install ruff
      if: steps.select.outputs.lint != 'false'
      run: |
        python -m pip install --upgrade pip
        pip install 'ruff~=0.16.0'
    - name: Ruff
      if: steps.select.outputs.lint != 'false'
      run: |
        ruff --version
        ruff check .
