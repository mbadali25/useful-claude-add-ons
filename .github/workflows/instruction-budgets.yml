name: Instruction budgets

# A pull_request does not start this workflow directly: ci.yml does, through
# workflow_call, and only when the PR's changed files need it (or always, for
# marketplace and instruction-budgets) - scripts/ci-route.py decides. push runs
# only on main, so main itself is tested in full after every merge.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  # Nightly full-matrix run: PRs test Python 3.12 only (see RUN_LEG below),
  # so 3.11/3.13 are covered here and on every push to main.
  schedule:
    - cron: '17 7 * * *'

# No concurrency block: a PR's runs are ci.yml's, whose own block cancels a
# superseded run - and this workflow with it. Under workflow_call,
# github.workflow is the CALLER's name, so the old group here would have put
# all six called workflows in one group with ci.yml itself.

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other versions the moment one fails -- when a check is
      # version-specific, seeing the whole matrix is what tells you that.
      fail-fast: false
      matrix:
        # Matches the pylint and pytest jobs. Both scripts are stdlib-only.
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # PR CI runs Python 3.12 only; push to main, workflow_dispatch and the
      # nightly schedule run the whole matrix. The 3.11/3.13 legs still EXIST
      # on a PR, because branch protection required their check names before
      # ci.yml (it now requires only `CI gate`): a
      # job-level `if:` cannot read `matrix`, so every step below is gated on
      # this instead and those legs finish green in seconds having run nothing
      # but the notice step. Env values are strings, hence == 'true'.
      RUN_LEG: ${{ github.event_name != 'pull_request' || matrix.python-version == '3.12' }}
    steps:
    - name: Python ${{ matrix.python-version }} leg SKIPPED on pull_request
      if: env.RUN_LEG != 'true'
      run: echo "::notice::PR CI runs Python 3.12 only. This ${{ matrix.python-version }} leg was SKIPPED, not passed; it runs on push to main, workflow_dispatch and the nightly schedule."
    - uses: actions/checkout@v4
      if: env.RUN_LEG == 'true'
      with:
        # check_allowance_no_silent_raise needs a default-branch ref
        # (origin/main) to diff .budget-allowance.json against. actions/checkout
        # defaults to a 1-commit shallow clone with no other refs fetched, so
        # _resolve_default_branch() finds neither origin/main nor main and the
        # checker fails closed with "could not resolve a default branch" --
        # correctly, since it genuinely could not answer. fetch-depth: 0 gets
        # the full history and every remote ref instead of hand-picking one
        # (git fetch --no-tags origin main:refs/remotes/origin/main), which
        # would silently stop working the day the default branch is renamed.
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      if: env.RUN_LEG == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Check instruction budgets, stale names, references and policy IDs
      if: env.RUN_LEG == 'true'
      # Wired in at crew 1.0.0, once T2's deletions cleared the intentional red
      # findings it carried; running it here earlier would only have taught
      # people to ignore a red job. The allowance file (plugin/crew/.budget-allowance.json)
      # is the only exception to the command budget, and growth even there fails.
      #
      # On a `push` to `main`, `--base` is passed explicitly rather than left
      # to check_allowance_no_silent_raise's own default: that default
      # resolves `origin/main` and diffs against `merge-base HEAD origin/main`,
      # but by the time this job's checkout has fetched refs, the push
      # already advanced the remote's `main` -- so `origin/main` IS this same
      # commit, the merge-base is HEAD itself, and a raised ceiling is
      # compared against a copy of the allowance file with the SAME raise
      # already in it, which can never fail. `github.event.before` is the sha
      # `main` pointed to immediately before this push, which is what the
      # comparison actually needs; `HEAD~1` is the fallback for the one case
      # `before` cannot answer (a new branch's first push reports it as all
      # zeros). A `pull_request` run is untouched -- there, `origin/main`
      # genuinely has not merged the PR's commits yet, so the existing
      # merge-base default already compares against the right point.
      run: |
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE"
          else
            BASE="HEAD~1"
          fi
          python3 scripts/check_instructions.py --base "$BASE"
        else
          python3 scripts/check_instructions.py
        fi
    - name: Budget checker regression suite
      if: env.RUN_LEG == 'true'
      # The checker's fail-open paths each have a must-fail case here; a checker
      # that went silent would otherwise look exactly like a clean repo. Builds
      # throwaway git repos under a temp dir and sets their identity itself.
      run: python3 scripts/_test/instruction-budgets.py
