name: Runner auto-start

# The self-hosted runner host (mbadali25/github-runner-infra) stops itself after
# IDLE_STOP_HOURS without a job, and stopping deletes CREW_RUNNER, so CI falls
# back to GitHub-hosted runners rather than waiting. This workflow notices that
# on the next push or PR and asks github-runner-infra to start the host again
# ("Runners > start": start, wait for all runners Idle, set CREW_RUNNER).
#
# The run that notices stays on hosted runners; runs after the host is back
# (a few minutes) land on the self-hosted pool. Nothing here can stop, resize
# or tear down the host - it only dispatches `start`.
#
# Needs secret RUNNER_START_TOKEN: a fine-grained PAT scoped to
# mbadali25/github-runner-infra only, Actions: read and write. Without it the
# job says so and exits 0, and a token that cannot see that repo (HTTP 401,
# 403 or 404) is a warning and exit 0 too - auto-start is optional, CI never
# depends on it.
# Fork PRs get no secrets, so they never start the host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# Many pushes in a row must not queue many starts.
concurrency:
  group: runner-autostart
  cancel-in-progress: false

jobs:
  start-if-stopped:
    # CREW_RUNNER is set only while the host is up and its runners are Idle.
    if: vars.CREW_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Runners > start unless one is already pending
        env:
          GH_TOKEN: ${{ secrets.RUNNER_START_TOKEN }}
          INFRA_REPO: mbadali25/github-runner-infra
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RUNNER_START_TOKEN is not set, so the self-hosted runners were NOT started. CI runs on GitHub-hosted runners."
            exit 0
          fi
          # REST endpoints throughout, never `gh run list --workflow` or
          # `gh workflow run`: those resolve the workflow, and `gh workflow
          # run` reads its YAML, before the call this job needs. A 404 from
          # the Actions calls below is not about contents permission: GitHub
          # answers 404, not 403, for a private repo the token cannot see,
          # which is what a token without access to $INFRA_REPO gets.
          #
          # api METHOD PATH [gh args...]: sets $status (HTTP code, empty when
          # no response came back) and $body; never exits on an HTTP error.
          api() {
            local method=$1 path=$2 out rc=0
            shift 2
            out=$(gh api -i -X "$method" "$path" "$@" 2>/dev/null) || rc=$?
            # First line is the status line ("HTTP/2.0 404 Not Found").
            # Parameter expansion, not `| head`: under pipefail a large body
            # would SIGPIPE the writer and fail the job.
            status=""
            read -r _ status _ <<<"${out%%$'\n'*}" || true
            body=$(printf '%s\n' "$out" | tr -d '\r' | awk 'found{print} /^$/{found=1}')
            if [ -z "$status" ]; then
              echo "::error::gh api $method $path got no HTTP response (gh exit $rc)."
              exit 1
            fi
            # A 2xx status line from a gh that still failed (a body it could
            # not read, a CLI error after the response) is not a success.
            case "$status" in
              2??) if [ "$rc" -ne 0 ]; then
                     echo "::error::gh api $method $path got HTTP $status but gh exited $rc."
                     exit 1
                   fi ;;
            esac
          }
          # 401/403/404 = the token cannot reach the repo or its Actions.
          # Auto-start is optional, so that is a warning, not a red check.
          # Any other non-2xx keeps failing.
          check() {
            case "$status" in
              2??) return 0 ;;
              401|403|404)
                echo "::warning::RUNNER_START_TOKEN cannot see $INFRA_REPO (HTTP $status on $1), so auto-start of the self-hosted runners was skipped. CI runs on GitHub-hosted runners. The token needs Actions: read and write on $INFRA_REPO."
                exit 0 ;;
              *)
                echo "::error::$1 failed with HTTP $status: $body"
                exit 1 ;;
            esac
          }
          api GET "repos/$INFRA_REPO/actions/workflows/runners.yml/runs?per_page=20"
          check "GET runners.yml/runs"
          pending=$(printf '%s' "$body" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$pending" -gt 0 ]; then
            echo "::notice::A Runners run is already queued or in progress in $INFRA_REPO; not starting another."
            exit 0
          fi
          api POST "repos/$INFRA_REPO/actions/workflows/runners.yml/dispatches" \
            -f ref=main -f 'inputs[action]=start'
          check "POST runners.yml/dispatches"
          echo "::notice::Self-hosted runners were stopped; dispatched Runners > start in $INFRA_REPO."
