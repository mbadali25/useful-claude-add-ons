name: Pytest (crew + gizmoduck plugins, skill suites)

# push runs only on main: a feature branch is tested by its pull_request run
# (the merge result), not twice. pull_request alone would never test main
# itself after a merge, so both are declared.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly full-matrix run: PRs test Python 3.12 only (see RUN_LEG below),
  # so 3.11/3.13 are covered here and on every push to main.
  schedule:
    - cron: '17 7 * * *'

# One run per PR at a time: a new push to the PR cancels the superseded run.
# Every non-PR run (push to main, schedule, workflow_dispatch) gets its own
# group via run_id, so nothing on main is ever cancelled or queued behind
# another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-set:
    # The Linux Python suites, as one matrix over python-version x set (L-0590):
    #   default    crew's default set with -n (xdist), plus gizmoduck's and the
    #              skill suites, then cisco-meraki and wazuh-onprem;
    #   wallclock  crew's `-m wallclock` set, serially (see the default step).
    # The two sets of one version run as parallel jobs instead of one after
    # the other, so a PR's 3.12 legs overlap (the wallclock set was ~110 s of
    # serial tail on every leg). The REQUIRED checks `test (3.11|3.12|3.13)`
    # are the `test` fan-in below, not these jobs.
    #
    # Opt-in self-hosted pool. The owner's runner playbook
    # (mbadali25/github-runner-infra) sets repo variable CREW_RUNNER=self-hosted
    # on `make up` and unsets it on `make down`, so required checks never wait on
    # a torn-down runner pool. Unset, this is ubuntu-latest exactly as before.
    # Fork PRs never reach the pool (owner 2026-09-30, "No fork PRs"): this repo
    # is public, so only non-PR events and same-repo PRs may use it.
    name: test-${{ matrix.set }} (${{ matrix.python-version }})
    runs-on: ${{ (vars.CREW_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","crew"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      # One leg at a time on every non-PR event (push to main, schedule,
      # dispatch). Those run all six legs, and the self-hosted pool is six
      # runners on ONE 16-vCPU host: three Python legs at once there were the
      # source of main's timing-test flakes (BRIEF 2026-10-01). No merge
      # waits on a non-PR run (protection requires a PR up to date with main,
      # not main green), so main pays the serial time. A PR does work on 3.12
      # only and keeps both of its legs in parallel.
      max-parallel: ${{ github.event_name == 'pull_request' && 6 || 1 }}
      matrix:
        # Matches the pylint job's floor: pylint 4 needs >=3.10, and these
        # scripts are stdlib-only so there is nothing else to pin against.
        python-version: ["3.11", "3.12", "3.13"]
        set: [default, wallclock]
    env:
      # PR CI runs Python 3.12 only; push to main, workflow_dispatch and the
      # nightly schedule run the whole matrix. The 3.11/3.13 legs still EXIST
      # on a PR, because a job-level `if:` cannot read `matrix`, so every step
      # below is gated on this instead and those legs finish green in seconds
      # having run nothing but the notice step. Env values are strings, hence
      # == 'true'. The `test` fan-in carries the SAME expression; it does not
      # trust it, though: it also requires this job's per-leg marker.
      RUN_LEG: ${{ github.event_name != 'pull_request' || matrix.python-version == '3.12' }}
    steps:
    - name: Python ${{ matrix.python-version }} leg SKIPPED on pull_request
      if: env.RUN_LEG != 'true'
      run: echo "::notice::PR CI runs Python 3.12 only. This ${{ matrix.python-version }} ${{ matrix.set }} leg was SKIPPED, not passed; it runs on push to main, workflow_dispatch and the nightly schedule."
    - uses: actions/checkout@v4
      if: env.RUN_LEG == 'true'
    - name: Set up Python ${{ matrix.python-version }}
      if: env.RUN_LEG == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pytest
      if: env.RUN_LEG == 'true'
      run: |
        python -m pip install --upgrade pip
        # python-docx is NOT optional either, for the same reason pyyaml is
        # not. skills/doc-builder/scripts/_test/test_cross_os_paths.py imports
        # build_sop and check_conformance, both of which `import docx` at
        # module top. Without it that module raises at COLLECTION, and a
        # collection error interrupts the whole pytest run -- crew's 1686 tests
        # included -- rather than failing one test. The module carries a
        # matching `pytest.importorskip("docx")` so an environment without it
        # skips instead of erroring; this line is what stops that skip becoming
        # permanent and the three os.path.isabs regressions never running here.
        #
        # numpy and pillow are required by the SAME suite, for
        # test_render_engine.py's `verify_borders` fixture: it stubs pymupdf
        # (so that one is genuinely not needed) but deliberately does not stub
        # numpy or Pillow, because the border sweep is measured against the
        # real libraries rather than modelled. Those 12 tests were erroring
        # unseen behind the collection interrupt above; with it fixed they are
        # the difference between 149 passed / 12 errors and 161 passed.
        #
        # requests is required by skills/intune-graph/scripts/_test/, whose
        # test_export_report.py imports export_report.py, which does `import
        # requests` at module top (it's the real dependency the script calls
        # requests.get with in production - the test monkeypatches
        # requests.get itself, not the import). Without it collection dies
        # the same way the yaml one below does, taking the whole job with it.
        pip install 'pytest~=8.0' pytest-xdist pyyaml python-docx numpy pillow requests
    - name: Run crew + gizmoduck plugin tests and the collision-free skill suites
      if: env.RUN_LEG == 'true' && matrix.set == 'default'
      # Scoped to named directories on purpose, and NOT because of
      # skills/cisco-meraki/tests/test_live_smoke.py -- which is what this
      # comment used to claim. That file is decorated
      # `@unittest.skipUnless(MERAKI_LIVE_TEST == "1" and a key is set)`, so
      # with neither variable present it SKIPS; it does not fail and it does
      # not error at collection. Measured: `pytest skills/cisco-meraki/tests/`
      # on a machine with no MERAKI_* variables gives 133 passed, 4 skipped.
      # The old reason was wrong, and wrong in the direction that keeps a
      # healthy suite permanently out of CI for a danger it does not pose.
      #
      # cisco-meraki is still not in THIS command, for a real reason that is
      # about the runner and not about the suite: see the separate step below.
      #
      # pyyaml is NOT optional, and this comment used to say it was: it
      # described gizmoduck's scripts/_test/ as "stdlib-only subprocess tests,
      # no extra install step needed". That claim was false and it is what
      # would stop the next person adding the dependency. The tests import
      # plugin/gizmoduck/scripts/routine.py and scanners/zap.py, both of which
      # import yaml, so without it collection dies with `ModuleNotFoundError:
      # No module named 'yaml'` and EVERY test in this job is skipped on all
      # three Python versions - crew's included, since one interrupted
      # collection takes the whole run down.
      #
      # That is what made this job useless rather than merely red: it reported
      # no test by name and looked like a plain failure. Verified by blocking
      # the yaml import locally, which reproduces the same 12 collection
      # errors the runner logs.
      #
      # -n 16 --dist worksteal (pytest-xdist): the crew suite is subprocess-
      # bound, not CPU-bound -- serially it held one core at ~33% -- so
      # workers overlap the waits. The count is fixed, not `auto`: on the
      # self-hosted pool `auto` meant 4 (the runner's
      # PYTEST_XDIST_AUTO_NUM_WORKERS). Benchmarked there (L-0590, 5 runs per
      # setting): p50 260 s at 4/load, 211 s at 8/load,
      # 171 s at 12/load, 145 s at 8/worksteal; then, beside a busy slow-
      # set chain (the PR shape), 221 s at 8/worksteal, 197 s at 12, 135 s
      # at 16 (rows in .work/tickets/L-0590/evidence.md, untracked; the
      # run ids are 37058615163 and 37080675891).
      #
      # EXCEPT the `wallclock` set (crew's conftest): those assert
      # elapsed time against a real hook timeout, and beside busy workers one
      # read 10.25s against its 10s bound on 2 of 6 jobs. They run serially
      # in this job's `wallclock` legs, so the bound stays the real one.
      run: pytest plugin/crew/tests/ plugin/gizmoduck/scripts/_test/ skills/mermaid-svg-bitbucket/tests/ skills/notify/tests/ skills/doc-builder/scripts/_test/ skills/intune-graph/scripts/_test/ -n 16 --dist worksteal -m "not wallclock" -v
    - name: Run crew's wall-clock-bounded tests serially
      if: env.RUN_LEG == 'true' && matrix.set == 'wallclock'
      run: pytest plugin/crew/tests/ -m wallclock -v
    - name: Run the cisco-meraki skill tests
      if: env.RUN_LEG == 'true' && matrix.set == 'default'
      # A SEPARATE pytest process, and it has to be. plugin/crew/tests/ and
      # skills/cisco-meraki/tests/ each contain a file named `context.py`
      # whose import side effect is what puts that skill's scripts/ on
      # sys.path. Neither directory has an __init__.py, so pytest's default
      # prepend import mode gives both the top-level module name `context`:
      # whichever is imported first wins sys.modules, the second `import
      # context` is a no-op, and the skill it was supposed to serve never gets
      # its scripts/ directory. In one combined process that is 8 collection
      # errors reading `ModuleNotFoundError: No module named 'meraki_http'`,
      # and a pytest collection interrupt takes every other test in the job
      # down with it -- the same all-or-nothing failure the pyyaml note below
      # describes.
      #
      # Splitting the invocation is the smallest fix that changes no test
      # file. The alternative (renaming one context.py, or adding __init__.py
      # to both) edits suites that are green, in two marketplace entries, to
      # work around a runner detail.
      run: pytest skills/cisco-meraki/tests/ -v
    - name: Run the wazuh-onprem skill tests
      if: env.RUN_LEG == 'true' && matrix.set == 'default'
      # skills/wazuh-onprem/scripts/_test/test_manager_config_remote_paths.py
      # puts scripts/ on sys.path itself (no separate context.py file, so it
      # does not hit the context.py collision the step above works around)
      # and imports only manager_config, which is stdlib-only (argparse,
      # difflib, os, posixpath, tempfile, uuid, subprocess, sys, time) - no
      # extra pip install needed. Kept as its own step anyway, not folded
      # into the combined run above: manager_config is a name unique to this
      # skill today, but a second skill importing something also named
      # manager_config into the same collection would hit the exact
      # sys.modules collision documented above, and a separate step is what
      # keeps that always false rather than merely false today.
      run: pytest skills/wazuh-onprem/scripts/_test/ -v

    - name: Mark this leg as run
      # Reached only when every step above succeeded (no `if: always()`),
      # and only on a leg that does work. The fan-in requires this marker
      # for both sets of its version, so a leg whose steps were skipped
      # cannot read as a pass there. Written under runner.temp, which the
      # runner empties at the start of every job: a self-hosted workspace
      # persists between runs, so a marker left there by an earlier run
      # could otherwise be uploaded or read as this run's.
      if: env.RUN_LEG == 'true'
      run: |
        mkdir -p "$RUNNER_TEMP/leg-marker"
        echo "ran" > "$RUNNER_TEMP/leg-marker/${{ matrix.set }}"
    - name: Upload the marker
      if: env.RUN_LEG == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: test-ran-${{ matrix.set }}-${{ matrix.python-version }}
        path: ${{ runner.temp }}/leg-marker/
        if-no-files-found: error
        retention-days: 3

  test:
    # The REQUIRED checks `test (3.11)`, `test (3.12)`, `test (3.13)`: the
    # job id and matrix are what produce those names, so neither changes.
    # A fan-in over `test-set` (L-0590). `always()`, because a skipped
    # required check counts as passed: this job must run whatever happened
    # above and fail on anything but success. `needs.test-set.result` is ONE
    # result over all six legs, so on a non-PR event any failed leg turns
    # all three checks red (the `test-<set> (<python>)` checks say which);
    # on a PR only the 3.12 legs do work.
    needs: test-set
    if: always()
    runs-on: ${{ (vars.CREW_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","crew"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      RUN_LEG: ${{ github.event_name != 'pull_request' || matrix.python-version == '3.12' }}
    steps:
    - name: Python ${{ matrix.python-version }} leg SKIPPED on pull_request
      if: env.RUN_LEG != 'true'
      run: echo "::notice::PR CI runs Python 3.12 only. This ${{ matrix.python-version }} leg was SKIPPED, not passed; it runs on push to main, workflow_dispatch and the nightly schedule."
    - name: Download this version's leg markers
      if: env.RUN_LEG == 'true'
      # A missing marker is the next step's to report, by name. Into
      # runner.temp (emptied at every job start), never the workspace: this
      # job has no checkout, and on the self-hosted pool its workspace keeps
      # whatever an earlier run left there.
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: test-ran-*-${{ matrix.python-version }}
        path: ${{ runner.temp }}/leg-markers
        merge-multiple: true
    - name: Check both sets ran and passed
      env:
        SET_RESULT: ${{ needs.test-set.result }}
      run: |
        if [ "$SET_RESULT" != success ]; then
          echo "::error::test-set finished '$SET_RESULT', not success: see the test-default/test-wallclock checks for the failed leg."
          exit 1
        fi
        if [ "$RUN_LEG" = true ]; then
          for set in default wallclock; do
            if [ ! -f "$RUNNER_TEMP/leg-markers/$set" ]; then
              echo "::error::test-$set (${{ matrix.python-version }}) left no marker: its steps did not all run and pass."
              exit 1
            fi
          done
        fi
        echo "test-set: $SET_RESULT; markers present for this version where required."

  crew-shell-matrix:
    # The full bash/pwsh driver matrix for crew's hooks -- every test marked
    # `slow` (plugin/crew/tests/conftest.py). The `test-default` legs above
    # run crew's DEFAULT set, which deselects it: there the python driver runs every
    # decision case and the shells run a parity sample per hook. This job is
    # what keeps the rest of the matrix run on Linux; the crew-windows-* jobs
    # below run it, and the rest of crew's suite, natively on Windows.
    #
    # One leg, still a matrix, so its check keeps the name
    # `crew-shell-matrix (ubuntu-latest)`. The Windows leg that used to sit
    # here was one serial job of ~37 minutes (default set, then wallclock,
    # then slow); it is now the crew-windows-* jobs, and its REQUIRED check
    # name `crew-shell-matrix (windows-latest)` belongs to their fan-in,
    # crew-windows-gate, so branch protection did not change (L-0577).
    #
    # pwsh is found by crew_fixtures.resolve_pwsh() -- `shutil.which`, then
    # C:\Program Files\PowerShell\7\pwsh.exe -- and always spawned by that
    # absolute path, never bare. It is preinstalled on both images.
    #
    # pytest-xdist is installed HERE only, as a speed-up: the suite does not
    # depend on it and runs the same without `-n`.
    #
    # Opt-in self-hosted pool. The owner's runner playbook
    # (mbadali25/github-runner-infra) sets repo variable CREW_RUNNER=self-hosted
    # on `make up` and unsets it on `make down`, so required checks never wait on
    # a torn-down runner pool. Unset, the leg runs on matrix.os as before.
    # Fork PRs never reach the pool (owner 2026-09-30, "No fork PRs"): this repo
    # is public, so only non-PR events and same-repo PRs may use it.
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && vars.CREW_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","crew"]') || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install pytest
      # pyyaml: three crew test modules import it at module top, so without
      # it collection fails and takes the whole run down with it.
      run: |
        python -m pip install --upgrade pip
        pip install "pytest~=8.0" pytest-xdist pyyaml
    - name: Run crew's slow set (the full per-shell hook matrix)
      # -n 8, not `auto` (= 4 on the self-hosted pool). Benchmarked there
      # (L-0590, 5 runs per setting): p50 154 s at 4, 92 s at 8; worksteal
      # did not help (161 s at 4, 98 s at 8); then, beside a busy default-
      # set chain, 110 s at 8, 96 s at 12, 89 s at 16. 8, because on a PR this leg runs
      # beside test-default's 16 workers and the serial wallclock legs, and
      # it is not the critical path there.
      run: python -m pytest plugin/crew/tests -m slow -n 8 -v

  # ---- crew on Windows: three parallel sets, one required fan-in -----------
  #
  # On Windows every shell case is a process creation plus a python start
  # inside it (0.8-1.4 s a case, docs/review/06-windows-burn-in.md), so crew's
  # suite there is long: as one job it took a p50 of 37.1 min (370 runs,
  # 2026-09-30..10-01) -- default set 27.4 min, slow 8.8, wallclock 2.2.
  # Branch protection is strict, so every merge to main reran it on every open
  # PR. The sets now run as parallel jobs:
  #
  #   crew-windows-default  the default set (`-m "not wallclock"`), split in 3
  #                         by pytest-split. It is the only place the
  #                         unmarked PowerShell parity-sample cases run
  #                         natively on Windows: the `test` job runs the same
  #                         set on ubuntu only.
  #   crew-windows-slow     `-m slow`, the full bash/pwsh hook matrix.
  #   crew-windows-wallclock `-m wallclock`, serially: those tests assert
  #                         elapsed time against a real bound, and beside busy
  #                         workers they read past it.
  #   crew-windows-gate     named `crew-shell-matrix (windows-latest)`, the
  #                         required check. Passes only through
  #                         scripts/check-windows-shards.py.
  #
  # Every set first saves a `--collect-only -q` of itself, then runs with
  # `--durations=50` and a JUnit XML, and uploads both (`if: always()`). The
  # gate checks every job succeeded, each shard collected the identical
  # default set, the shards' JUnit together name every collected test exactly
  # once, and slow and wallclock ran exactly what they collected. Anything
  # missing or unreadable fails it: a skipped required check counts as a pass,
  # so the gate runs `if: always()` and never skips itself.
  #
  # Path scope, as before: on a pull_request the Windows jobs run only when the
  # PR changes plugin/crew/** or this file (a PR editing them must run them);
  # every other event always runs them. crew-windows-decide decides, and a
  # skipped PR reports a skipped pass on the gate with a notice. Not an
  # `on: pull_request: paths:` filter: that would drop the whole workflow and
  # leave its required checks pending.
  #
  # The split is by count until a durations file is committed: with none,
  # pytest-split's least_duration weighs every test equally and deals them
  # round-robin by name, which spreads each function's parametrisations across
  # the shards. Each shard stores its measured durations (durations.json in
  # its artifact) so that file can be built from real Windows timings.
  #
  # Runner: every crew-windows-* job takes `runs-on` from
  # crew-windows-decide's `runs-on` output, set in one line there. The Windows
  # steps use `shell: pwsh` and `python` (what setup-python puts on PATH), not
  # Git Bash or `python3`, so they assume nothing only the hosted image has.
  #
  # Every `run:` step in a Windows job carries `if: runner.os == 'Windows'`.
  # The job already runs only there; the step condition is what tells
  # scripts/gate-runner.py's CI drift check that a Linux host cannot run it.

  crew-windows-decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      runs-on: ${{ steps.decide.outputs.runs_on }}
    steps:
    - uses: actions/checkout@v4
      with:
        # The PR merge commit plus its first parent (the base tip): all the
        # decision below diffs.
        fetch-depth: 2
    - name: Decide whether the Windows jobs run
      id: decide
      # A diff that cannot be computed RUNS them: an unknown answer must not
      # read as "nothing under plugin/crew changed".
      run: |
        run=true
        if [ "${{ github.event_name }}" = pull_request ]; then
          if changed=$(git diff --name-only HEAD^1 HEAD -- plugin/crew .github/workflows/pytest-crew.yml); then
            if [ -z "$changed" ]; then
              run=false
              echo "::notice::crew-shell-matrix (windows-latest) SKIPPED, not passed: this PR changes nothing under plugin/crew/ or .github/workflows/pytest-crew.yml. It runs on push to main, the nightly schedule and workflow_dispatch."
            fi
          else
            echo "::warning::crew-shell-matrix (windows-latest): could not diff the PR against its base (git diff HEAD^1 HEAD failed), so the Windows jobs run."
          fi
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"
        # Where every crew-windows-* job runs, as JSON for fromJSON(): a label
        # string or a label array. The ONE place to retarget them (e.g. at a
        # self-hosted Windows pool); the gate's check name does not change.
        echo 'runs_on="windows-latest"' >> "$GITHUB_OUTPUT"

  crew-windows-default:
    name: crew-windows-default (${{ matrix.group }}/3)
    needs: crew-windows-decide
    if: needs.crew-windows-decide.outputs.run == 'true'
    runs-on: ${{ fromJSON(needs.crew-windows-decide.outputs.runs-on) }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The shard count is also in `--splits 3` below and in the gate's
        # `--shards 3`. A mismatch fails closed: `--group` past `--splits` is
        # a usage error, and the gate fails on a missing or extra shard.
        group: [1, 2, 3]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install pytest
      if: runner.os == 'Windows'
      # pytest-split is pinned: every shard must split the same way.
      run: |
        python -m pip install --upgrade pip
        pip install "pytest~=8.0" pytest-xdist pyyaml "pytest-split==0.11.0"
    - name: Collect the whole default set (what the shards must cover together)
      if: runner.os == 'Windows'
      # utf-8 for the collection file only. NOT job-wide: the run steps'
      # hooks inherit it, so a hook's python child writes utf-8 to bash and
      # test_the_session_key_is_the_same_in_every_flavour[sh] fails
      # (2 underscores for one non-ASCII char). main runs those steps without it.
      env:
        PYTHONIOENCODING: utf-8
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path crew-ci | Out-Null
        python -m pytest plugin/crew/tests -m "not wallclock" --collect-only -q > crew-ci/collected.txt
        if ($LASTEXITCODE -ne 0) { Get-Content crew-ci/collected.txt -Tail 40; exit $LASTEXITCODE }
        Get-Content crew-ci/collected.txt -Tail 3
    - name: Run crew's default set, shard ${{ matrix.group }} of 3
      if: runner.os == 'Windows'
      shell: pwsh
      run: python -m pytest plugin/crew/tests -n auto -m "not wallclock" -v --splits 3 --group ${{ matrix.group }} --splitting-algorithm least_duration --store-durations --durations-path crew-ci/durations.json --durations=50 --junitxml=crew-ci/junit.xml
    - name: Upload the collection, JUnit and durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crew-windows-default-${{ matrix.group }}
        path: crew-ci/
        if-no-files-found: warn
        retention-days: 14

  crew-windows-slow:
    needs: crew-windows-decide
    if: needs.crew-windows-decide.outputs.run == 'true'
    runs-on: ${{ fromJSON(needs.crew-windows-decide.outputs.runs-on) }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install pytest
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install "pytest~=8.0" pytest-xdist pyyaml
    - name: Collect crew's slow set
      if: runner.os == 'Windows'
      # utf-8 for the collection file only. NOT job-wide: the run steps'
      # hooks inherit it, so a hook's python child writes utf-8 to bash and
      # test_the_session_key_is_the_same_in_every_flavour[sh] fails
      # (2 underscores for one non-ASCII char). main runs those steps without it.
      env:
        PYTHONIOENCODING: utf-8
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path crew-ci | Out-Null
        python -m pytest plugin/crew/tests -m slow --collect-only -q > crew-ci/collected.txt
        if ($LASTEXITCODE -ne 0) { Get-Content crew-ci/collected.txt -Tail 40; exit $LASTEXITCODE }
        Get-Content crew-ci/collected.txt -Tail 3
    - name: Run crew's slow set (the full per-shell hook matrix)
      if: runner.os == 'Windows'
      shell: pwsh
      run: python -m pytest plugin/crew/tests -m slow -n auto -v --durations=50 --junitxml=crew-ci/junit.xml
    - name: Upload the collection and JUnit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crew-windows-slow
        path: crew-ci/
        if-no-files-found: warn
        retention-days: 14

  crew-windows-wallclock:
    needs: crew-windows-decide
    if: needs.crew-windows-decide.outputs.run == 'true'
    runs-on: ${{ fromJSON(needs.crew-windows-decide.outputs.runs-on) }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install pytest
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install "pytest~=8.0" pytest-xdist pyyaml
    - name: Collect crew's wall-clock-bounded set
      if: runner.os == 'Windows'
      # utf-8 for the collection file only. NOT job-wide: the run steps'
      # hooks inherit it, so a hook's python child writes utf-8 to bash and
      # test_the_session_key_is_the_same_in_every_flavour[sh] fails
      # (2 underscores for one non-ASCII char). main runs those steps without it.
      env:
        PYTHONIOENCODING: utf-8
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path crew-ci | Out-Null
        python -m pytest plugin/crew/tests -m wallclock --collect-only -q > crew-ci/collected.txt
        if ($LASTEXITCODE -ne 0) { Get-Content crew-ci/collected.txt -Tail 40; exit $LASTEXITCODE }
        Get-Content crew-ci/collected.txt -Tail 3
    - name: Run crew's wall-clock-bounded tests serially
      if: runner.os == 'Windows'
      shell: pwsh
      run: python -m pytest plugin/crew/tests -m wallclock -v --durations=50 --junitxml=crew-ci/junit.xml
    - name: Upload the collection and JUnit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crew-windows-wallclock
        path: crew-ci/
        if-no-files-found: warn
        retention-days: 14

  crew-windows-gate:
    # The REQUIRED check. Its name is the old Windows leg's, character for
    # character; renaming it changes branch protection's required list.
    name: crew-shell-matrix (windows-latest)
    needs: [crew-windows-decide, crew-windows-default, crew-windows-slow, crew-windows-wallclock]
    # always(), not !cancelled(): a skipped required check counts as passed,
    # so this job must run whatever happened above, and a cancelled or
    # skipped need is a failure the checker reports.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Download the Windows jobs' artifacts
      if: needs.crew-windows-decide.outputs.run == 'true'
      # A missing artifact is the checker's to report, by name, so a failed
      # download does not stop the job here.
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: crew-windows-*
        path: crew-ci-artifacts
    - name: Check every Windows job ran and no test was lost
      env:
        DECIDE_RESULT: ${{ needs.crew-windows-decide.result }}
        RUN: ${{ needs.crew-windows-decide.outputs.run }}
        EVENT: ${{ github.event_name }}
        DEFAULT_RESULT: ${{ needs.crew-windows-default.result }}
        SLOW_RESULT: ${{ needs.crew-windows-slow.result }}
        WALLCLOCK_RESULT: ${{ needs.crew-windows-wallclock.result }}
      run: python3 scripts/check-windows-shards.py --shards 3 --artifacts crew-ci-artifacts --decide-result "$DECIDE_RESULT" --run "$RUN" --event "$EVENT" --job "default=$DEFAULT_RESULT" --job "slow=$SLOW_RESULT" --job "wallclock=$WALLCLOCK_RESULT"
