name: Pytest (crew + gizmoduck plugins, skill suites)

# push alone tests the branch tip, never the merge result a PR would produce.
# Matches marketplace.yml and mcp-servers.yml, which already declare both.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the pylint job's floor: pylint 4 needs >=3.10, and these
        # scripts are stdlib-only so there is nothing else to pin against.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pytest
      run: |
        python -m pip install --upgrade pip
        # python-docx is NOT optional either, for the same reason pyyaml is
        # not. skills/doc-builder/scripts/_test/test_cross_os_paths.py imports
        # build_sop and check_conformance, both of which `import docx` at
        # module top. Without it that module raises at COLLECTION, and a
        # collection error interrupts the whole pytest run -- crew's 1686 tests
        # included -- rather than failing one test. The module carries a
        # matching `pytest.importorskip("docx")` so an environment without it
        # skips instead of erroring; this line is what stops that skip becoming
        # permanent and the three os.path.isabs regressions never running here.
        #
        # numpy and pillow are required by the SAME suite, for
        # test_render_engine.py's `verify_borders` fixture: it stubs pymupdf
        # (so that one is genuinely not needed) but deliberately does not stub
        # numpy or Pillow, because the border sweep is measured against the
        # real libraries rather than modelled. Those 12 tests were erroring
        # unseen behind the collection interrupt above; with it fixed they are
        # the difference between 149 passed / 12 errors and 161 passed.
        #
        # requests is required by skills/intune-graph/scripts/_test/, whose
        # test_export_report.py imports export_report.py, which does `import
        # requests` at module top (it's the real dependency the script calls
        # requests.get with in production - the test monkeypatches
        # requests.get itself, not the import). Without it collection dies
        # the same way the yaml one below does, taking the whole job with it.
        pip install 'pytest~=8.0' pyyaml python-docx numpy pillow requests
    - name: Run crew + gizmoduck plugin tests and the collision-free skill suites
      # Scoped to named directories on purpose, and NOT because of
      # skills/cisco-meraki/tests/test_live_smoke.py -- which is what this
      # comment used to claim. That file is decorated
      # `@unittest.skipUnless(MERAKI_LIVE_TEST == "1" and a key is set)`, so
      # with neither variable present it SKIPS; it does not fail and it does
      # not error at collection. Measured: `pytest skills/cisco-meraki/tests/`
      # on a machine with no MERAKI_* variables gives 133 passed, 4 skipped.
      # The old reason was wrong, and wrong in the direction that keeps a
      # healthy suite permanently out of CI for a danger it does not pose.
      #
      # cisco-meraki is still not in THIS command, for a real reason that is
      # about the runner and not about the suite: see the separate step below.
      #
      # pyyaml is NOT optional, and this comment used to say it was: it
      # described gizmoduck's scripts/_test/ as "stdlib-only subprocess tests,
      # no extra install step needed". That claim was false and it is what
      # would stop the next person adding the dependency. The tests import
      # plugin/gizmoduck/scripts/routine.py and scanners/zap.py, both of which
      # import yaml, so without it collection dies with `ModuleNotFoundError:
      # No module named 'yaml'` and EVERY test in this job is skipped on all
      # three Python versions - crew's included, since one interrupted
      # collection takes the whole run down.
      #
      # That is what made this job useless rather than merely red: it reported
      # no test by name and looked like a plain failure. Verified by blocking
      # the yaml import locally, which reproduces the same 12 collection
      # errors the runner logs.
      run: pytest plugin/crew/tests/ plugin/gizmoduck/scripts/_test/ skills/mermaid-svg-bitbucket/tests/ skills/notify/tests/ skills/doc-builder/scripts/_test/ skills/intune-graph/scripts/_test/ -v
    - name: Run the cisco-meraki skill tests
      # A SEPARATE pytest process, and it has to be. plugin/crew/tests/ and
      # skills/cisco-meraki/tests/ each contain a file named `context.py`
      # whose import side effect is what puts that skill's scripts/ on
      # sys.path. Neither directory has an __init__.py, so pytest's default
      # prepend import mode gives both the top-level module name `context`:
      # whichever is imported first wins sys.modules, the second `import
      # context` is a no-op, and the skill it was supposed to serve never gets
      # its scripts/ directory. In one combined process that is 8 collection
      # errors reading `ModuleNotFoundError: No module named 'meraki_http'`,
      # and a pytest collection interrupt takes every other test in the job
      # down with it -- the same all-or-nothing failure the pyyaml note below
      # describes.
      #
      # Splitting the invocation is the smallest fix that changes no test
      # file. The alternative (renaming one context.py, or adding __init__.py
      # to both) edits suites that are green, in two marketplace entries, to
      # work around a runner detail.
      run: pytest skills/cisco-meraki/tests/ -v
    - name: Run the wazuh-onprem skill tests
      # skills/wazuh-onprem/scripts/_test/test_manager_config_remote_paths.py
      # puts scripts/ on sys.path itself (no separate context.py file, so it
      # does not hit the context.py collision the step above works around)
      # and imports only manager_config, which is stdlib-only (argparse,
      # difflib, os, posixpath, tempfile, uuid, subprocess, sys, time) - no
      # extra pip install needed. Kept as its own step anyway, not folded
      # into the combined run above: manager_config is a name unique to this
      # skill today, but a second skill importing something also named
      # manager_config into the same collection would hit the exact
      # sys.modules collision documented above, and a separate step is what
      # keeps that always false rather than merely false today.
      run: pytest skills/wazuh-onprem/scripts/_test/ -v

  crew-shell-matrix:
    # The full bash/pwsh driver matrix for crew's hooks -- every test marked
    # `slow` (plugin/crew/tests/conftest.py). The `test` job above runs crew's
    # DEFAULT set, which deselects it: there the python driver runs every
    # decision case and the shells run a parity sample per hook. This job is
    # what keeps the rest of the matrix run, on both operating systems.
    #
    # Why it is split out: on Windows every shell case is a process creation
    # plus a python start inside it (0.8-1.4 s a case, measured by
    # docs/review/06-windows-burn-in.md), and with the matrix in it the default
    # run could not finish there at all.
    #
    # pwsh is found by crew_fixtures.resolve_pwsh() -- `shutil.which`, then
    # C:\Program Files\PowerShell\7\pwsh.exe -- and always spawned by that
    # absolute path, never bare. It is preinstalled on both images.
    #
    # pytest-xdist is installed HERE only, as a speed-up: the suite does not
    # depend on it and runs the same without `-n`.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install pytest
      # pyyaml: three crew test modules import it at module top, so without
      # it collection fails and takes the whole run down with it.
      run: |
        python -m pip install --upgrade pip
        pip install "pytest~=8.0" pytest-xdist pyyaml
    - name: Run crew's slow set (the full per-shell hook matrix)
      run: python -m pytest plugin/crew/tests -m slow -n auto -v
