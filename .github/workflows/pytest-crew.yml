name: Pytest (crew + gizmoduck plugins)

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the pylint job's floor: pylint 4 needs >=3.10, and these
        # scripts are stdlib-only so there is nothing else to pin against.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pytest
      run: |
        python -m pip install --upgrade pip
        # PyYAML is a REAL dependency, not test scaffolding: scripts/routine.py
        # imports yaml to parse the targets manifest, and every scanner adapter
        # test imports routine transitively. Without it all 13 gizmoduck test
        # modules fail at COLLECTION with "No module named 'yaml'" - which
        # reads as 13 broken tests rather than one missing package.
        pip install 'pytest~=8.0' 'PyYAML~=6.0'
    - name: Run crew + gizmoduck plugin tests
      # Scoped to these two directories on purpose. An unscoped run would also
      # collect skills/cisco-meraki/tests/test_live_smoke.py, which needs live
      # credentials and would fail every push. gizmoduck's scripts/_test/ is
      # its `tickets` confirmation-gate regression suite - stdlib-only
      # subprocess tests, no extra install step needed.
      run: pytest plugin/crew/tests/ plugin/gizmoduck/scripts/_test/ -v
