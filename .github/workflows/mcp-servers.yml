name: MCP servers (Microsoft)

# push runs only on main: a feature branch is tested by its pull_request run
# (the merge result), not twice. pull_request alone would never test main
# itself after a merge, so both are declared.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR at a time: a new push to the PR cancels the superseded run.
# Every non-PR run (push to main, schedule, workflow_dispatch) gets its own
# group via run_id, so nothing on main is ever cancelled or queued behind
# another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp-servers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Every package's test script passes an explicit glob
          # ("dist/test/**/*.test.js") rather than a bare directory path to
          # node --test, deliberately -- a bare directory argument has behaved
          # inconsistently across Node versions. The glob form has been verified
          # locally on Node 26; 22 is this repo's documented LTS floor.
          node-version: "22"
      - name: Install workspace dependencies
        run: npm ci
      # Every test mocks fetch and passes a fake TokenCredential -- no live
      # tenant or network access is used or required.
      - name: Build and run offline tests
        run: npm test
