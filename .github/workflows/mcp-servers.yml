name: MCP servers (Microsoft)

# A pull_request does not start this workflow directly: ci.yml does, through
# workflow_call, and only when the PR's changed files need it (or always, for
# marketplace and instruction-budgets) - scripts/ci-route.py decides. push runs
# only on main, so main itself is tested in full after every merge.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# No concurrency block: a PR's runs are ci.yml's, whose own block cancels a
# superseded run - and this workflow with it. Under workflow_call,
# github.workflow is the CALLER's name, so the old group here would have put
# all six called workflows in one group with ci.yml itself.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp-servers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Every package's test script passes an explicit glob
          # ("dist/test/**/*.test.js") rather than a bare directory path to
          # node --test, deliberately -- a bare directory argument has behaved
          # inconsistently across Node versions. The glob form has been verified
          # locally on Node 26; 22 is this repo's documented LTS floor.
          node-version: "22"
      - name: Install workspace dependencies
        run: npm ci
      # Every test mocks fetch and passes a fake TokenCredential -- no live
      # tenant or network access is used or required.
      - name: Build and run offline tests
        run: npm test
